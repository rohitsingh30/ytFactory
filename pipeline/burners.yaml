# ytFactory burner accounts manifest — single source of truth.
#
# Burners are YouTube accounts used purely for cross-engagement
# (likes + subscribes on production channels' uploads). They never
# author or publish content. Driven by the Playwright laptop-agent
# (com.ytfactory.laptop-agent.plist) and pipeline.burner_engage.
#
# Adding / removing a burner = edit this file. No Python change.
# pipeline/channels.py loads + validates this on import.
#
# This is committed alongside pipeline/channels.yaml (production
# channels) — same structure, separate file because burners are
# cross-channel auth accounts, not channels with their own niches.
#
# Per-machine Chrome user-data-dirs are NOT here — those stay in
# ~/.config/ytfactory/ where the Playwright agent expects them.

