# MyStoriesAnimated — animated Reddit/AITA stories, uploaded to the
# MyStoriesAnimated YouTube channel.
#
# Visual + audio config is identical to aita_animated.yaml — same
# Z-Image-Turbo flat-crayon aesthetic, same Kokoro TTS defaults — and
# the only thing this YAML adds on top is the upload: block at the
# bottom that points Stage 8 at the right Google account and metadata.
#
# To switch which YouTube channel this targets:
#   1. Authenticate the desired Google account once:
#        .venv/bin/python upload.py auth --account mystoriesanimated
#   2. (No code change needed — `upload.account` below picks the cached
#      token from ~/.config/ytfactory/youtube_token_<account>.json.)

name: MyStoriesAnimated
source_adapter: reddit_video

# ---- TTS ---------------------------------------------------------------
# Chatterbox (Resemble AI, MIT) with a 9.5s ref clip of the original
# Chatterbox's emotion-exaggeration knob is the right fit for AITA's
# escalating-drama narration arc. Free, no API cap, runs locally on
# M2 Max via MPS.
tts_provider: cloudrun_chatterbox
tts_voice: pipeline/voice_refs/sarah.wav
tts_speed: 0.90

# ---- Image gen ---------------------------------------------------------
# Style rewritten 2026-05-17 to match the actual production look of the
# uploaded MyStoriesAnimated channel (warm hand-drawn watercolor + ink
# line illustrations with real distinct characters), and to pass the
# new channel-richness gate in pipeline/llm/prompts.py. Pre-fix this
# was 40 words of "flat 2D crayon" that resolved on Z-Image-Turbo as
# headless floating-objects clip-art (job 3cd2b3b5 post-mortem).
image_style_prefix: |
  Warm hand-drawn 2D illustration in the style of modern indie
  webcomics. Confident ink line work with varying weight — thick
  contour outlines, lighter interior strokes. Watercolor and
  colored-pencil fills with visible paper grain and soft brush
  texture; never flat vector. Warm narrative palette: dusty pink,
  sage green, mustard yellow, warm brown, soft beige, slate blue.
  Two-tone cel shading with soft cast shadows on right side of faces
  and props. Compositions stay readable on a phone screen: three-
  quarter view of characters, mid-frame subject, soft blurred
  background. Every object in frame is unmarked and unbranded — cups
  are plain ceramic, bottles are smooth glass without labels,
  packaging shows no logos, walls have no signs, screens are blank.
  ZERO printed text, ZERO numbers, ZERO brand markings anywhere in
  the rendered frame — the caption pill overlay is added by post-
  processing after diffusion.

# 2026-05-24 — default_scene_anchor closes the floating-jersey
# failure mode for long-form scene-only panels. The 845bdb0d render
# (r/nosleep "30-hour flight") shipped with 58/77 panels carrying
# no character token and only a short scene sentence ("Cloud-filled
# sky from airplane wing.") — with the noun-tag anti-text boilerplate
# dominating the prompt, every such panel rendered as a floating
# white t-shirt. The new refiner pipeline
# (pipeline/images/prompt_refiner.py, REFINER_VERSION=v3-scene-anchor)
# weaves this string into refined_scene whenever the beat's authored
# scene lacks a setting; that gives the model a concrete grounding
# instead of the blank-product-photo attractor.
#
# Pick a value generic enough to apply to most stories this channel
# tells (Reddit nosleep / AITA / TIFU / wiki oddities). Per-variant
# override lives in pipeline/variants/mystoriesanimated/<variant>.yaml
# if the variant has a fixed setting (e.g. a courtroom-cliffhanger
# variant could pin "inside a wood-panelled courtroom, fluorescent
# overhead light").
default_scene_anchor: >
  An everyday domestic / urban / public-space setting drawn in the
  channel's warm hand-illustrated style; never a product-photo studio
  or blank backdrop. Render the room or location implied by the scene
  with visible furniture, props, and depth — kitchen counters, office
  desks, transit interiors, walking paths, living rooms — so the
  panel reads as a moment inside a story, not an isolated object on a
  plain background.

# Backwards-compat fallback for stories rendered before per-story cast
# authoring (pipeline/cast.py writes data/intermediate/<channel>/cast/<slug>.json).
# Rewritten 2026-05-17 with rich face/clothing detail tokens so the
# channel-richness gate passes and diffusion renders a real character
# instead of "round-headed dot-eyed cartoon shape" (the literal pre-
# fix text). Per-story cast.json overrides this for specific
# narrators (different ages, ethnicities, outfits).
character_description: |
  A 29-year-old woman with shoulder-length wavy brown hair rendered
  in visible strand groups (never a solid block). Almond-shaped eyes
  with visible dark pupils and short eyelashes. Soft expressive
  eyebrows that articulate emotion per beat — arched in surprise,
  furrowed in frustration, level when neutral. Small defined nose
  with a faint shadow on the right side. Articulated mouth that
  changes shape with the spoken line — small open when speaking,
  pressed flat when resigned, downturned when frustrated, slight
  upturn at the corners when amused. Soft pink blush marks on
  cheekbones when emotionally activated. Wears a fitted mustard-
  yellow cotton t-shirt with visible fabric folds at the collar and
  shoulders, faded blue jeans with a visible waistband. Soft warm
  cel shading on the right cheek and right collar. Same locked
  appearance across every beat — never re-described, only re-posed.

opening_image_directives:
  required_concrete_tokens: 2
  example_tokens: ["kitchen counter", "phone on table", "red mug",
                   "leaning forward", "hand on hip", "wooden door"]

image_seed: 42
# image_steps: bumped 4 → 9 on 2026-05-17 — 9 is Z-Image-Turbo's
# server-spec sweet spot (see cloud/image-z-image-turbo/server.py:149).
# Pre-fix YAML hard-capped at 4 because the laptop mflux path was
# slow on M2; cloud GPU has no such constraint, and step=4 produces
# the under-detailed clip-art look (job 3cd2b3b5 post-mortem).
image_steps: 9
image_width: 768
image_height: 1344

# ---- Beat / output -----------------------------------------------------
beat_target_s: 2.0
beat_max_s: 3.2
duration_target_s: [10, 20]
output_resolution: [1080, 1920]

# ---- Closer CTA --------------------------------------------------------
closer_format: "LIKE if YTA, COMMENT if NTA. AITA?"
closer_hold_s: 1.0

# ---- Upload (Stage 8) --------------------------------------------------
#
# The `account` here picks which OAuth token to use:
#   ~/.config/ytfactory/youtube_token_<account>.json
# Run `python upload.py auth --account mystoriesanimated` once,
# signed into the Google account that owns the MyStoriesAnimated YouTube
# channel, to populate that file.
#
# privacy:
#   private  — only you can see it (default — review before going live)
#   unlisted — anyone with the link can see it (use for review by others)
#   public   — listed publicly the moment YouTube finishes processing
#
# YouTube hard limits: title ≤ 100 chars, description ≤ 5000, ≤ 500
# tags totaling ≤ 500 chars. derive_metadata() truncates as needed.
upload:
  account: mystoriesanimated
  privacy: private
  made_for_kids: false
  category_id: "24"          # Entertainment
  auto_upload: false         # set true to upload at the end of make_shorts.py
  tags:
    - aita
    - reddit
    - reddit stories
    - storytime
    - animated story
    - shorts
    - story time
  description_template: |
    {script.hook}

    📖 Original story: {raw.url}
    From r/{raw.metadata.subreddit} by u/{raw.metadata.author}.

    ━━━━━━━━━━━━━━━━━━━━
    👍 LIKE if YTA  ·  💬 COMMENT if NTA
    🔔 Subscribe for more animated stories.
    ━━━━━━━━━━━━━━━━━━━━

    #shorts #aita #reddit #redditstories #storytime

# ---- Long-form (16:9) --------------------------------------------------
# Added 2026-05-12 as part of Slice 2 of the unified-renderer rollout
# (see plan.md). Lets the form's "Long video" option actually produce a
# 5-30 min 16:9 video on this channel instead of silently rendering a
# 9:16 Short. render_mode=image_panels keeps the channel's animated
# aesthetic (no archival footage to lean on for a Reddit-stories
# channel). Reuses the cloud Chatterbox + Flux2 services already
# deployed for Shorts; no new GPU services needed.
long_form:
  render_mode: image_panels
  # TTS — Chatterbox cloned from sarah.wav, slowed slightly so 30+ min
  # listens are calm enough to not be exhausting. atempo=0.92 keeps the
  # voice warm without F5-style smearing.
  tts_provider: cloudrun_chatterbox
  tts_voice: pipeline/voice_refs/sarah.wav
  tts_speed: 0.95
  tts_post_atempo: 0.92
  tts_chunk_target_chars: 380
  tts_chunk_join_silence_s: 0.4
  # Audio mix — narration loud, bed quiet so it doesn't compete.
  audio_narration_db: -6
  audio_music_bed_db: -28
  audio_source_mix: 0.0
  # Output — 1080p 16:9 horizontal.
  duration_target_s: [600, 1800]   # 10-30 min sweet spot
  duration_max_s: 1800
  output_resolution: [1920, 1080]
  output_fps: 30
  # Captions on for long-form (eyes-open viewers in the
  # awake-engagement window read them).
  captions_enabled: true
  caption_style:
    text_rgba: [255, 217, 61, 255]   # yellow italic, matches sleep-history convention
    box_rgba: [0, 0, 0, 160]
    font_size: 42
  # Image panels — z-image-turbo on cloud, same provider Shorts uses.
  # archival_shotlist would be wrong for this channel (no footage
  # source to draw from).
  #
  # Panel cadence (single source of truth — read by both
  # _planned_sections_and_panels at rewrite time AND _aggregate's
  # truncate). Empirically tuned against animated-stills retention
  # research (see docs/panel_pacing_research_2026-05.md): ~25s per
  # panel = ~2.4 PPM for a 30-min long-form → ~72 panels. Previously
  # hardcoded at 7s/panel in code (asked LLM for 257; got 25; renderer
  # dropped to 10) — the headline bug behind the 60-min-Cloud-Run-
  # timeout failures on this channel.
  panel_seconds_target: 25
  panel_max_count: 120
  image_seed: 4242
  image_steps: 9    # Z-Image-Turbo spec sweet spot (was 4 — unified 2026-05-23)
  image_width: 1344
  image_height: 768
  image_style_prefix: |
    Flat 2D crayon-style children's drawing with thick black outlines and
    soft pastel fill colors (warm beige, dusty pink, mustard yellow,
    light blue). Round-headed simple cartoon shapes. 16:9 horizontal
    composition with subject centred.
  # Visuals are static stills + hard cuts (no on-clip motion, no
  # crossfade) — keeps Cloud Run wall time well under the 3600s task
  # timeout for 30-min long-form jobs.
  music_bed_default: ambient_low.mp3
  # Animated channel — no support-asks. (historyrecapped uses
  # ask_cadence_s: 1080 for periodic LIKE/SUB asks; that breaks the
  # crayon-aesthetic vibe here.)
