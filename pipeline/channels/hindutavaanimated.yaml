# HindutavaAnimated — Mahabharat ki kahaaniyan, narrated in pure Hindi,
# animated in Amar Chitra Katha comic-book style.
#
# Format (decided 2026-05-03, Sanskrit dropped 2026-05-03):
#   Pure Hindi storytelling — one dramatic episode from the epic per
#   Short, hooked at the top, lesson-as-punchline at the end.
#
#   1. hook (3s) — provocative one-liner ("क्या आप जानते हैं…")
#   2. setup (2-3 beats) — who, what, where
#   3. rising action (2-3 beats) — the dramatic moment escalates
#   4. climax / payoff (1 beat) — the moral pivot of the scene
#   5. lesson + spoken CTA (1 beat) — "जय श्री कृष्णा कमेंट करें,
#      चैनल सब्सक्राइब करें"
#
# Source candidates: Abhimanyu chakravyuh, Eklavya guru-dakshina,
# Karna kavach-kundal daan, Bheeshma iccha-mrityu, Draupadi cheer-haran,
# Ashwatthama ka shraap, etc.
#
# This channel is NOT a Reddit/sports clone — there is no auto source
# adapter. Stories are curated. `source_adapter: manual` tells stage 1
# to skip pulling and just expect a hand-authored script.json under
# hindutavaanimated/narrations/<slug>.json.

name: HindutavaAnimated
source_adapter: manual

# ---- TTS ---------------------------------------------------------------
# Kokoro hf_alpha (Hindi female, Apache 2.0, local).
#
# ---- TTS ---------------------------------------------------------------
# Voice matrix bench (2026-05-07) confirmed IndicF5 wins ALL 4 Hindi cells
# (composite 95-99 vs Indic Parler 84-88, Higgs 77-92, Kokoro 43-65).
# Production winner: cloudrun_indicf5 with announcer-quality voice ref
# from AI4Bharat IndicVoices-R (CC-BY-4.0). Falls back to local
# Kokoro hf_alpha on cloud failure (only on-laptop Hindi voice).
#
# Voice ref selection logic:
#   - Shorts narration → Indian female storyteller voice (announcer
#     quality, SNR 71 dB, mid-pitch 200-220 Hz, 30-45 age)
#   - Long-form kathaa → Indian female meditation voice (SNR 70 dB,
#     calm low-female pitch ~192 Hz, 45-60 age)
#
# Both refs live in pipeline/voice_refs/bench/ and were sourced from
# AI4Bharat IndicVoices-R (CC-BY-4.0) using a 65+dB SNR + low pitch
# variance + measured speaking rate filter. See
# scripts/pull_hindi_voices.py for selection criteria.
#
# Long-form / Sanskrit history (kept for context):
#   2026-05-04 → 2026-05-06: Defaulted to local Kokoro hf_alpha.
#   2026-05-06: Migrated to cloud Hindi (cloudrun_indicf5).
#   2026-05-07: Voice matrix bench → cloudrun_indicf5 wins all cells.
#     Voice matrix replaced the legacy single bench voice with a
#     3-ref rotation under pipeline/voice_refs/hindi-female-storyteller-{
#     dramatic,calm,devotional}/. Catalog name resolves to the calm
#     variant by default; channel-bench rotation picks per-render.
#   2026-05-15: stale ``bench/hindutavaanimated__shorts__hindi_female_storyteller/``
#     path removed — that dir was deleted by the 3-ref rotation but the
#     YAML still referenced it. Cloud renders failed with::
#
#         cloudrun_indicf5 provider requires `ref_audio_text`
#
#     because the catalog resolver "skipped" the missing-WAV entry,
#     unresolved name passed through to IndicF5 → no transcript →
#     contract error. Switching to the catalog name lets the resolver
#     pick a real on-disk ref + its transcript.
tts_provider: cloudrun_indicf5
tts_voice: hindi-female-storyteller-calm
tts_ref_text: प्यारी पद्मा, कल तुम्हारा खत मिला, आज जवाब लिख रही हूँ।
tts_language: hi
tts_speed: 1.0       # Per-sentence modulation in audio.py drives final pacing.

# ---- Image gen — Amar Chitra Katha aesthetic --------------------------
# Style rewritten 2026-05-17 to pass the channel-richness gate in
# pipeline/llm/prompts.py. Preserves the Amar Chitra Katha aesthetic
# while explicitly listing palette, technique, and anti-text token
# classes — the gate requires all three, and Z-Image-Turbo needs the
# anti-text positive-presence anchors so banners, scrolls, and palm-
# leaf manuscripts don't render with gibberish fake-Devanagari.
image_style_prefix: |
  Amar Chitra Katha Indian comic-book illustration style. Bold black
  ink outlines with varying weight — thick contour strokes, lighter
  interior detail. Flat saturated cel fills painted with hand-drawn
  technique, never vector. Traditional ACK palette: deep sindoor red,
  peacock blue, marigold yellow, emerald green, antique gold, ivory,
  and warm sandstone tones. Stylized expressive Indian faces with
  large dark almond eyes and visible pupils, defined eyebrows that
  articulate emotion per beat, slightly pursed or open mouth, and
  warm cheek shading. Decorative temple-mural background motifs —
  carved sandstone arches, lotus-petal halos, banyan leaf canopies,
  river-bank tilework. Soft directional warm light from above, gentle
  shadow falloff on the right side of figures. Composition centered
  and iconographic, like a single comic-book panel. No modern objects.
  Every banner, scroll, palm-leaf manuscript, conch shell, and metal
  vessel is plain and unmarked — surfaces are smooth, no Devanagari
  text, no Latin text, no inscriptions, no symbols other than the
  blank background motif. ZERO printed text or numerals in the
  rendered frame; the caption overlay is added by post-processing.

# 2026-05-24 — default_scene_anchor closes the floating-jersey
# failure mode (F29) for long-form scene-only panels on this
# channel. See pipeline/channels/mystoriesanimated.yaml for the
# bug context. Channel-appropriate setting for Hindu mythology:
# the stories are set in Mahabharat-era / Ramayan-era India and
# need a concrete period-Indian backdrop on panels whose authored
# scene is short ("Distant mountain at dusk." → without the
# anchor the model defaults to product-photo blank-background).
default_scene_anchor: >
  An ancient Indian setting drawn in the channel's Amar Chitra
  Katha comic-book style — palace courtyards with carved sandstone
  pillars, temple sanctums with oil-lamp glow, sacred-river
  ghats at dawn, forest hermitages with banyan trees, royal
  council halls with marigold garlands, mountain passes at dusk.
  Render the visible setting around the action, never an isolated
  object on a plain studio background.

# Per-story character lock (cast.json overrides). The fallback below
# only applies when a story has no cast.json yet.
character_description: |
  Mahabharat-era Indian warrior in his late twenties. Fair-skinned
  with a soft golden undertone; dark wavy hair tied back in a knot
  at the crown, a few loose strands framing the temples. Expressive
  large dark almond eyes with visible pupils and short lashes.
  Defined dark eyebrows that articulate emotion per beat — arched
  in resolve, furrowed in conflict, level at rest. Small straight
  nose with soft cheek-shadow on the right. Articulated mouth that
  shifts shape with the spoken beat — set in determination,
  slightly parted when in dialogue, downturned in grief. Bold black
  ink outline. Wears a saffron warrior tunic with gold trim at the
  neck and hem, an ivory dhoti, a gold armlet on the right bicep,
  small gold ear-stud earrings. Same locked appearance across every
  beat.

opening_image_directives:
  required_concrete_tokens: 2
  example_tokens: ["chariot wheel", "Gandiva bow", "conch shell",
                   "saffron flag", "rising sun", "two armies facing",
                   "ashram clearing", "guru's hut", "river bank"]

# Locked seed for character consistency across beats.
image_seed: 108  # auspicious in Hindu tradition
image_steps: 9  # Z-Image-Turbo spec sweet spot (was 4 — stale laptop carryover).
image_width: 768
image_height: 1344

# ---- Beat shape -------------------------------------------------------
# Slightly longer holds than AITA — kathaa is a slower medium and
# Devanagari captions need reading time.
beat_target_s: 3.0
beat_max_s: 5.0

# ---- Output -----------------------------------------------------------
# 50-60s — matches the 2026 Shorts algo sweet spot (memory: project_shorts_algo_2026).
duration_target_s: [50, 60]
output_resolution: [1080, 1920]

# ---- Closer CTA (devotional storytelling variant) --------------------
# No YTA/NTA verdict-bait. Spoken CTA is woven into the last beat
# (per feedback_closer_caption_style — captions = narration only),
# and the closer panel is a simple namaste + subscribe overlay.
closer_format: "जय श्री कृष्णा 🙏  SUBSCRIBE"
closer_hold_s: 1.5

# ---- Long-form kathaa mode (NEW 2026-05-05) ---------------------------
# Companion format to the Shorts. Authored via /make-katha; rendered
# via historyrecapped/scripts/render_footage_only.py --aspect 16:9.
# Same Kokoro hf_alpha voice; 16:9 horizontal; no captions by default;
# 6-10 chapters per video; 2 embedded asks.
kathaa:
  aspect: "16:9"
  output_resolution: [1920, 1080]
  duration_band: [50, 70]      # minutes
  caption_mode: none           # 'none' | 'devanagari'
  tts_speed: 1.0
  music_bed_db: -28            # ambient bed under narration
  closer_hold_s: 1.5
  upload_category_id: "22"     # People & Blogs (move to 27 Education if pivoting)
  description_template: |
    {script.metadata.invocation}

    🕉️ कथा: {script.metadata.episode}
    📿 अध्याय / कांड: {script.metadata.section}

    {chapter_timestamps_block}

    📖 स्रोत:
    {sources_block}

    ━━━━━━━━━━━━━━━━━━━━
    🙏 {script.blessing_close}
    🔔 SUBSCRIBE for more such kathaa
    ━━━━━━━━━━━━━━━━━━━━

    #hindukatha #bhagavadgita #ramayan #mahabharat #hindumythology #devotional #spiritualhindi #meditation

# ---- Upload (Stage 8) — NOT WIRED YET ---------------------------------
# Channel doesn't exist on YouTube yet. To enable:
#   1. Create the YouTube channel under a Google account.
#   2. .venv/bin/python upload.py auth --account hindutavaanimated
#   3. Flip auto_upload below to true.
upload:
  account: hindutavaanimated
  privacy: private          # keep mocks private until human-reviewed
  made_for_kids: false
  category_id: "22"          # People & Blogs
  auto_upload: false
  tags:
    - mahabharat
    - mahabharat in hindi
    - hindi kahani
    - hindi story
    - krishna
    - hindu mythology
    - pauranik kathayen
    - shorts
    - devotional
    - spirituality
  description_template: |
    {script.hook}

    🕉️ कथा: {script.metadata.episode}

    ━━━━━━━━━━━━━━━━━━━━
    🙏 जय श्री कृष्णा
    🔔 Subscribe for more Mahabharat stories
    ━━━━━━━━━━━━━━━━━━━━

    #shorts #mahabharat #krishna #hindi #kahani #hindumythology #devotional

# ---- Long-form (16:9) — kathaa mode -----------------------------------
# Added 2026-05-12 (Slice 2 of unified-renderer rollout). Mythology
# kathaa long-form (60-90 min) — calming devotional narration of
# Mahabharat / Ramayan / Puraan chapters, image_panels of Amar Chitra
# Katha-style art (static stills, hard cuts). See /make-katha skill for
# the narration authoring side.
long_form:
  render_mode: image_panels
  tts_provider: cloudrun_indicf5
  tts_voice: hf_alpha
  tts_speed: 0.92
  tts_post_atempo: 0.95
  tts_chunk_target_chars: 320           # Hindi chars are heavier — smaller target
  tts_chunk_join_silence_s: 0.5
  audio_narration_db: -6
  audio_music_bed_db: -30               # ambient bhajan bed quieter
  audio_source_mix: 0.0
  duration_target_s: [3000, 5400]       # 50-90 min sweet spot
  duration_max_s: 7200
  output_resolution: [1920, 1080]
  output_fps: 30
  captions_enabled: true                # Devanagari subtitles for accessibility
  # Panel cadence — see mystoriesanimated.yaml for the rationale.
  # Hindu mythology long-form is 50-90 min; ~25s per panel = ~120-220
  # panels. Cap at 120 (the channel ceiling) — anything more bleeds
  # cost; the renderer will pad each hold proportionally.
  panel_seconds_target: 25
  panel_max_count: 120
  image_seed: 1008
  image_steps: 9    # Z-Image-Turbo spec sweet spot (was 4 — unified 2026-05-23)
  image_width: 1344
  image_height: 768
  image_style_prefix: |
    Amar Chitra Katha comic-book illustration style — bold black ink
    outlines, hand-painted vibrant colours (saffron, deep blue, gold,
    crimson), traditional Indian iconography (lotus motifs, mandalas,
    temple architecture). 16:9 horizontal composition with the central
    deity / scene weighted left-of-centre.
  music_bed_default: bhajan_low.mp3
