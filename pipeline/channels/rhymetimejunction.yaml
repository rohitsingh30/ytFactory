# Rhyme Time Junction — bilingual Hinglish nursery rhymes for kids,
# animated 2D cartoon style with a recurring mascot family. Format
# decided 2026-05-03; pilot rhyme: Hathi Raja Kahan Chale.
#
# CRITICAL DIFFERENCES from every other ytFactory channel:
#   1. AUDIO IS A SUNG SONG, NOT TTS. Generated externally via Suno
#      (user account; ~60-90s gen time, ~5 credits per song).
#      Pipeline must INGEST a pre-existing song.wav rather than synth
#      one. See `audio_provider: external_song` below.
#   2. CONTINUOUS ANIMATION, NOT SLIDESHOW. Each beat is a 3-5s
#      animated clip (image-to-video), not a still + Ken Burns. The
#      animation engine is TBD pending a 3-way spike (AnimateDiff vs
#      LTX-Video vs Wan 2.2 5B); v0 default is `motion_provider:
#      animatediff_lcm` (already wired in pipeline/animation.py).
#   3. RECURRING MASCOTS, NOT PER-STORY CAST. The mascot family
#      (Laddu, Jalebi, Tuk-Tuk, Dadi) appears in EVERY rhyme. Locked
#      via channel-level `cast` block below; per-story cast.json is
#      only used for guest characters per rhyme (e.g. the elephant in
#      Hathi Raja).
#   4. SUBTITLES = SUNG LYRICS, NOT NARRATION. Whisper transcribes the
#      Suno song for timestamps; the source `lyrics` block in
#      script.json is the canonical caption text (Whisper output is
#      ASR-noisy on sung Hindi). Karaoke-style captions per beat.
#
# PIPELINE WIRE-UP STATUS (as of 2026-05-03):
#   ⚠️  spoken-bridge TTS path — needs a Hindi-capable engine. F5-TTS
#       (the production English default) is English-only; Kokoro
#       hf_alpha is the working Hindi option if/when bridges ship.
#   ⏳ external_song audio mode — NOT wired yet in pipeline/audio.py;
#      first render will need that branch added (planned: skip synth,
#      copy <slug>/song.wav into the audio path, run ASR for beat
#      timestamps from sung lyrics)
#   ⏳ motion_provider on a non-AITA channel — animatediff_lcm exists
#      but has only been used on aita_animated_motion; needs a
#      production test on this channel's longer beat shape (3-5s vs
#      AITA's ~2s)
#   ⏳ multi-mascot scene composition — current cast.py emits ONE
#      narrator + supporting; rhyme scenes need 2-3 mascots in frame
#      simultaneously, prompt-engineered per beat

name: Rhyme Time Junction
source_adapter: manual  # curator hand-authors scripts/<slug>.json

# ---- Audio — Suno via sunoapi.org (sung, fully automated) -------------
# Decision 2026-05-03 round 2: user picked Suno via sunoapi.org wrapper
# after rejecting manual Suno ("I ain't doing shit") and a spoken-only
# fallback ("it is not singing at all"). Suno V4_5 is the best public
# AI singing model for Hinglish + kids' content; sunoapi.org provides
# REST access (https://api.sunoapi.org), pay-per-generation
# (~$0.05-0.10/song, top up at https://sunoapi.org/topup).
#
# Pipeline contract (audio_provider: sunoapi mode in make_shorts.py +
# pipeline/audio.synth_via_sunoapi):
#   - Reads suno_prompt.{lyrics, style} from data/intermediate/
#     rhymetimejunction/scripts/<slug>.json (authored by /make-rhyme).
#   - POSTs to sunoapi.org's /api/v1/generate, polls record-info until
#     status=SUCCESS, downloads the audio_url to <cache>/<slug>/narration.wav.
#   - Rest of pipeline (ASR, beats, captions, compose) runs unchanged.
#
# Required env: SUNOAPI_API_KEY (set in .env).
#
# Risk: sunoapi.org is an unofficial Suno wrapper; Suno periodically DMCAs
# these. Has weathered ~3 cycles since 2024, currently up. Fallback if it
# goes down: switch back to audio_provider: external_song and generate
# manually on suno.com.
#
# tts_provider/voice stay set so audio.synthesize() still works for any
# future spoken-bridge clips on this channel (Dadi intros) — but the
# main audio path is Suno (sung song). F5-TTS-MLX is English-only;
# spoken Hindi/Hinglish bridges via this config would mangle. If/when
# spoken bridges ship, swap to Kokoro hf_alpha (the only Hindi-capable
# provider in the repo).
# NOTE 2026-05-03: rendering Hathi Raja v0 with audio_provider: external_song
# (v2 Suno WAV pre-generated and dropped at songs/<slug>.wav) to avoid
# re-burning credits on a render that's primarily testing visuals + the
# new flat-crayon style. Future rhymes (where we DO want auto-gen) flip
# back to audio_provider: sunoapi by uncommenting the two lines below.
#
# 2026-05-13: flipped to audio_provider: sunoapi after the /api/scheduler/tick
# cron started auto-firing every 30 min. external_song mode is incompatible
# with cron-driven renders because the renderer suffixes the slug with
# `-<jobid8>` (cast/audio cache busting), so a pre-staged WAV at
# songs/hathi-raja-kahan-chale.wav can never match the runtime path
# songs/hathi-raja-kahan-chale-2972b69e.wav. Sunoapi keys off a
# (model, vocal, style, lyrics) fingerprint instead — same lyrics → same
# cache hit regardless of slug. SUNOAPI_API_KEY now mounted on
# render-worker-v2 from Secret Manager (sunoapi-key:1, granted to
# render-runner@). Persisted in
# docs/channel-learnings/rhymetimejunction/external_song_incompatible_with_cron.md.
# audio_provider: external_song
audio_provider: sunoapi
sunoapi_model: V4_5            # current best for kids' content; V5 also available
sunoapi_vocal_gender: f         # female lead (matches kid-rhyme convention)
tts_provider: cloudrun_chatterbox
tts_voice: pipeline/voice_refs/sarah.wav
tts_ref_text: "Anthropic just plugged Claude directly into Photoshop, Blender, and Ableton. They're called Connectors. Nine of them, shipped together, available on every Claude plan today."
tts_speed: 1.0

# ---- Image gen — 2D cartoon, kid-safe palette, mascot lock ------------
# Same Z-Image-Turbo provider as the other channels (proven on M2 Max).
# Style prefix locks the kid-friendly aesthetic at channel level —
# bright but not neon, soft outlines, full-body characters not portraits.
#
# CLASS-OF-BUG (diffusion negation trap; see feedback_diffusion_negation_trap):
# style prefix is pure positive descriptors — never "no scary faces",
# "no horror" etc. — those tokens AMPLIFY in z_image_turbo. Express
# what we WANT: "warm smiling expressions", "bright sunny daylight".
image_provider: cloudrun_z_image_turbo
# Style prefix mirrors aita_animated.yaml — the proven flat-2D crayon
# look that the AITA family ships consistently. User feedback round 2
# (2026-05-03 critique): the earlier custom Pingu/Peppa prefix combined
# with motion_provider: animatediff_lcm gave Lion-King fantasy elephants
# and anime-teen mascots because AnimateDiff's toonyou_beta6 base has a
# strong anime/Disney-villain prior. Switching to image_provider:
# z_image_turbo (slideshow path with Ken Burns) + the AITA crayon style
# fixes the visual consistency issue for v0.
image_style_prefix: |
  Warm hand-drawn children's-picture-book illustration in the style
  of contemporary Indian kids' rhyme videos (ChuChu TV / Infobells /
  Kids TV India). Confident black ink outlines with varying weight,
  soft watercolor and colored-pencil fills with visible paper grain,
  gentle brush texture; never harsh vector edges. Warm cheerful
  palette: marigold yellow, dusty pink, sky blue, mint green, soft
  beige, warm brown. Soft directional sunny lighting from upper-
  left with airy ambient fill, never harsh shadows. Round, friendly,
  bouncy character shapes — kid-safe, slightly chubby cheeks, big
  expressive eyes with visible pupils. Three-quarter view of the
  main subject mid-frame, supporting mascots in soft focus around
  the edges, airy negative space. Decorative festive motifs at the
  borders (marigold petals, paisley curls, mehndi swirls). Every
  prop in frame is plain and unmarked — bowls are blank ceramic,
  bottles are smooth glass, books are closed with blank covers,
  toys carry no printed text. ZERO printed text, ZERO numerals,
  ZERO English or Devanagari signage anywhere in the rendered
  frame; song-text overlays are added post-diffusion.

# Force-positive lock for the elephant + species + color (per critique
# 2026-05-03 v3 — render had the elephant drift into a bear with green
# overalls and a red apple at beat 17). Z-Image-Turbo amplifies positive
# tokens regardless of negation prefixes (memory:
# feedback_diffusion_negation_trap), so the lock is pure positive
# descriptors. Will be appended to every per-beat scene that names the
# elephant or hathi raja.
force_positive: |
  warm yellow-tan cartoon elephant with gold crown, brick-red embroidered
  blanket, smiling, kid-friendly, picture-book style
image_seed: 27          # marigold petals — locks the channel palette
image_steps: 9          # Z-Image-Turbo spec sweet spot (was 4 — stale laptop carryover).
image_width: 768
image_height: 1344

# ---- Mascot family — channel-level cast lock --------------------------
# These four characters appear in EVERY rhyme. Description prepended to
# every per-beat prompt so the diffusion model sees the same mascots
# every frame — analog of mystoriesanimated.character_description but
# for FOUR recurring characters.
#
# v0: stuffed into character_description as a single block (existing
# pipeline only reads ONE description). Per-mascot seeded sub-prompts
# would be cleaner — track as future work alongside the multi-mascot
# scene composition wire-up above.
character_description: |
  Four recurring mascots, always drawn the same:
  LADDU — five year old Indian boy, round chubby face, mustard yellow
  kurta with embroidered collar, navy blue jeans, short curly black
  hair, big curious brown eyes. Always bouncy and smiling.
  JALEEBI — seven year old Indian girl, two long black braids tied
  with magenta ribbons, magenta cotton frock with white polka dots,
  bossy big-sister expression, dimpled cheeks.
  TUK-TUK — small fawn pug puppy with a teal collar, comic relief,
  always reacting to whatever the kids are doing.
  DADI — grandmother in a cream sari with marigold border, white hair
  in a bun, gold nose stud, warm smile. Sets up each rhyme.

# Per-rhyme guest characters (the elephant in Hathi Raja, the moon in
# Twinkle, the fish in Machhli) live in cast.json under
# rhymetimejunction/cast/<slug>.json — same per-story
# cast pattern as sportstoriesanimated, just opt-in (mascots are the
# default load).
opening_image_directives:
  required_concrete_tokens: 2
  example_tokens: ["train station platform", "marigold lane",
                   "rooftop with pigeons", "village courtyard",
                   "riverbank stones"]

# ---- Animation mode — slideshow with Ken Burns (v0) -------------------
# motion_provider is INTENTIONALLY UNSET. The previous v0 (animatediff_lcm)
# loaded SD 1.5 + frankjoshua/toonyou_beta6 as the base, which has a
# strong anime / Disney-villain prior — the rendered output drifted into
# Lion King fantasy elephants + anime-teen mascots, completely off-brand
# for kids' content. User feedback round 2 (2026-05-03): "I hate this
# style, you should use the 2d animation one" — i.e. the AITA family's
# flat-crayon slideshow look.
#
# Slideshow path = z_image_turbo still per beat + Ken Burns pan/zoom in
# pipeline/compose.py. Lose continuous-animation differentiator; gain
# visual consistency with the rest of the channel family. Continuous
# animation comes back later via Wan 2.2 5B I2V or LTX-Video 2B (both
# local + free), once we've A/B'd those against the slideshow output
# and confirmed the kid-friendly look survives the I2V step.
# motion_provider: animatediff_lcm   # disabled — see comment block above

# ---- Beat shape — longer than narration channels ----------------------
# Rhymes are sung at slower tempo (~120 BPM, one phrase per 4 beats =
# 2s); each VERSE PHRASE = one animated beat. ~5s gives the motion
# model room to actually animate (a 1.5s clip on Pingu-style mascots
# stops at "still photo with lip-flap").
beat_target_s: 5.0
beat_max_s: 6.5

# ---- Output -----------------------------------------------------------
# Hard cap at 60s for the Shorts retention sweet spot (50-60s wins per
# project_shorts_algo_2026). The Suno song was authored at ~110s but
# returns ~150-160s; pipeline auto-trims to duration_max_s and drops
# the leading instrumental intro so the vocal lands at t=0 (kills the
# Whisper-hallucinates-on-instrumental class of bug at the source).
# Compilations come later as a separate channel YAML.
duration_target_s: [50, 60]
duration_max_s: 60                # hard cap; pipeline trims to this
audio_trim_start_s: 5.5           # skip past the vocal RAMP-IN, not just
                                  # the instrumental. Suno V4_5 has
                                  # 0-5s of instrumental, then a 0.5s
                                  # vocal ramp from -25dB to -17dB peak.
                                  # Whisper labels the FIRST audible
                                  # vocal as the first lyric, but the
                                  # user perceives the word as starting
                                  # at the peak, not the ramp-in. Trim
                                  # at 5.5 so trim t=0 is at peak vocal
                                  # — captions and perceived audio
                                  # align. (Bumped from 5.0 in v9
                                  # critique — residual 0.3-0.5s
                                  # caption-ahead-of-vocal-peak.)
audio_drop_vocal_pickup: false    # silenceremove was too aggressive on
                                  # Suno V4_5 — it ate the leading "S" of
                                  # "Suno" because vocal attack and
                                  # instrumental backing share the same
                                  # ~-22 dB band. Off; the RMS-mask in
                                  # transcribe_words handles caption-
                                  # over-instrumental at the right layer.
audio_fade_out_s: 0.8             # fade the final 0.8s of the trimmed song
                                  # so the closer hold transitions gracefully
                                  # from sung→quiet→still-image.
output_resolution: [1080, 1920]   # vertical for shorts

# ---- Closer — kid-safe like+subscribe ask, NOT AITA-style verdict ----
# The visual closer panel just shows a friendly bell + subscribe
# prompt; no verdict acronym CTA (this isn't a debate channel). Kids'
# algo rewards comments asking the next-rhyme question, so the closer
# invites the viewer to comment which rhyme should be next.
closer_format: "SUBSCRIBE for the next rhyme!\nCOMMENT your favorite rhyme below"
closer_hold_s: 0.4                # tightened to 0.4s after v5 critique —
                                  # the embedded CTA reads instantly; with
                                  # word timestamps now capped to audio
                                  # duration, captions don't roll past
                                  # song-end so 0.4s is enough hold for
                                  # mute viewers to see the play button.
script_check_strict: false  # rhymes don't fit AITA hook/CTA gating

# ---- Upload (Stage 8) — NOT WIRED YET ---------------------------------
# Channel doesn't exist on YouTube yet. To enable:
#   1. Create the Rhyme Time Junction YouTube channel under a Google account
#      (kid-content channels need careful Made For Kids setup — see
#      YouTube COPPA rules)
#   2. .venv/bin/python upload.py auth --account rhymetimejunction
#   3. Flip auto_upload below to true after Hathi Raja ships clean.
#
# made_for_kids: true is non-negotiable for nursery rhymes. Triggers
# COPPA mode on YouTube which restricts comments and ad targeting —
# accepted as a kids' channel cost.
upload:
  account: rhymetimejunction
  privacy: private          # promote to public after format sign-off
  made_for_kids: true        # COPPA — REQUIRED for kid content
  category_id: "27"          # Education (kid rhymes fit Education better
                             #   than Music/24 for COPPA classifier)
  auto_upload: false
  min_score: 8               # higher bar than other channels — kids'
                             #   format mistakes are jarring at scale
  tags:
    - kids songs
    - nursery rhymes
    - hindi rhymes
    - hinglish
    - bilingual kids
    - hathi raja
    - children songs
    - animated rhymes
    - kids learning
  description_template: |
    {script.hook}

    🎵 Sung by Suno · 🎨 Animated mascots: Laddu, Jalebi, Tuk-Tuk, Dadi

    ━━━━━━━━━━━━━━━━━━━━
    🔔 SUBSCRIBE for the next rhyme  ·  💬 COMMENT your favorite rhyme
    ━━━━━━━━━━━━━━━━━━━━

    #shorts #kidssongs #nurseryrhymes #hindirhymes #hinglish

# ---- Long-form (16:9) — kids-song compilation mode --------------------
# Added 2026-05-12 (Slice 2 of unified-renderer rollout). 30-60 min
# Hinglish nursery-rhyme compilation — chapters of sung songs (Suno)
# stitched with image_panels of the Laddu / Jalebi / Tuk-Tuk / Dadi
# mascots. Same Suno + Flux2 stack the Shorts use, just chained.
long_form:
  render_mode: image_panels
  # Audio path for kids-song compilation is "song" not TTS — the
  # long_form orchestrator detects audio_mode=song from the spec and
  # uses Suno for narration synthesis. tts_voice/provider here are the
  # fallback if the spec keeps audio_mode=voice.
  tts_provider: cloudrun_chatterbox
  tts_voice: pipeline/voice_refs/sarah.wav
  tts_speed: 0.95
  tts_post_atempo: 1.0
  tts_chunk_target_chars: 240
  tts_chunk_join_silence_s: 0.3
  audio_narration_db: -3
  audio_music_bed_db: -22
  audio_source_mix: 0.0
  duration_target_s: [1800, 3600]        # 30-60 min sweet spot
  duration_max_s: 3600
  output_resolution: [1920, 1080]
  output_fps: 30
  captions_enabled: true
  # Panel cadence — see mystoriesanimated.yaml for the rationale.
  # Rhyme channel is 30-60 min; ~25s per panel = ~72-144 panels.
  panel_seconds_target: 25
  panel_max_count: 120
  image_provider: cloudrun_z_image_turbo
  image_seed: 7777
  image_steps: 9    # Z-Image-Turbo spec sweet spot (was 4 — unified 2026-05-23)
  image_width: 1344
  image_height: 768
  image_style_prefix: |
    Cheerful 2D children's-book illustration: round-cheeked mascots
    Laddu (yellow puffy ball), Jalebi (curly-spiral orange), Tuk-Tuk
    (red autorickshaw with eyes), Dadi (smiling grandmother). Bright
    primary colours, sky-blue background, soft sunlight. 16:9
    horizontal composition with mascots centred.
  # Ken-Burns / crossfade REMOVED 2026-05-23 (see mystoriesanimated.yaml).
  music_bed_default: upbeat.mp3
