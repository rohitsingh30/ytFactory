# Voice catalog — named-voice resolver for ytFactory skills.
#
# Skills declare a voice by NAME in their channel config:
#
#     tts_voice: hindi-female-storyteller   # resolves via this catalog
#
# instead of the legacy path-style:
#
#     tts_voice: pipeline/voice_refs/.../ref.wav
#
# Both forms are accepted. Name-style lookups go through
# pipeline.voice_catalog.resolve_voice() which returns the WAV path
# AND its transcript (ref.txt sidecar) so callers no longer need to
# duplicate ``tts_ref_text`` in every channel config.
#
# Each entry has:
#   path:        repo-relative path to the ref WAV (5-15s, 24 kHz mono).
#                IndicF5 / F5-TTS work best at this length; longer refs
#                are truncated by the model.
#   transcript:  the spoken transcript of the WAV. Required for F5 +
#                IndicF5 prosody anchoring.
#   language:    ISO code (en / hi / etc.) for routing + caption hints.
#   register:    free-text style hint (storyteller / documentary /
#                emotional / news-anchor / etc.).
#   use_cases:   which channels/formats this voice is intended for.
#                Informational only — nothing enforces it.
#
# Storage: WAV + transcript are committed to the repo at
# ``pipeline/voice_refs/<name>/`` so cloud-rendering containers get
# them automatically (they're base64-shipped in the /synth request,
# not pulled from GCS). Single source of truth = the laptop checkout.
# To add a new voice: drop a 5-15s WAV + a ref.txt next to it under
# ``pipeline/voice_refs/<voice-name>/`` and add an entry below.

voices:
  hindi-female-storyteller:
    # 2026-05-15 — re-pointed to hindi-female-storyteller-calm. The
    # original ``bench/hindutavaanimated__shorts__hindi_female_storyteller/``
    # WAV was deleted by the 2026-05-07 3-ref rotation but the catalog
    # path was never updated. Cloud renders failed with::
    #
    #   voice 'hindi-female-storyteller' catalog entry points at missing
    #   WAV ... — skipping
    #   cloudrun_indicf5 provider requires `ref_audio_text`
    #
    # Aliasing here keeps any caller that still uses the legacy name
    # (channel YAMLs, /make-* skills, manual CLI invocations) working
    # while the underlying ref + transcript come from the calm variant
    # of the new 3-ref rotation. See docs/research/hindi_voice_refs_2026_05_07.md.
    path: pipeline/voice_refs/hindi-female-storyteller-calm/ref.wav
    transcript: "प्यारी पद्मा, कल तुम्हारा खत मिला, आज जवाब लिख रही हूँ।"
    language: hi
    register: storyteller
    duration_s: 8.0
    use_cases: [hindutavaanimated/shorts, hindutavaanimated/kathaa]
    notes: |
      LEGACY ALIAS (2026-05-15) — originally sourced from AI4Bharat
      IndicVoices-R (CC-BY-4.0); 65+dB SNR, mid-pitch 200-220 Hz,
      30-45 age band. Replaced 2026-05-07 by the
      hindi-female-storyteller-{dramatic,calm,devotional} 3-ref
      rotation. Kept here as a back-compat alias to the calm variant
      so legacy callers don't 404. See
      docs/research/hindi_voice_refs_2026_05_07.md.

