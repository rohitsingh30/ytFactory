  english-male-history-sleep-narrator:
    path: pipeline/voice_refs/english-male-history-sleep-narrator/ref.wav
    transcript: "It might mean sitting near the fire, absently turning a smooth pebble in your fingers, watching the smoke drift upward in twisting ribbons."
    language: en
    register: documentary-sleep-male
    duration_s: 9.96
    use_cases: [historyrecapped/long-form, historyrecapped/long-form-sleep]
    notes: |
      Deep calm male voice for long-form sleep-history. F0 median 121 Hz
      (IQR 108-126 Hz) — distinctly sub-165Hz male range, well below
      sarah's mid-soprano register. Sleep-evoking sensory prose ref
      (no proper nouns, no numbers, soft consonants) — F5-TTS produces
      consistent slow narrative cadence at this anchor.

      PROVENANCE (2026-05-08): clip extracted from
      https://youtu.be/AHTEnwz0bL4 ("What Did Early Humans ACTUALLY Do
      All Day?" from @SleepyTimeHistory) at 4133.0-4143.0s. The source
      channel describes their voice as "a digital replica of a
      professional voice actor" — i.e. it is itself a TTS output from
      a commercial voice-clone service (likely ElevenLabs or HeyGen),
      not a natural human recording. We use this 10s anchor as the F5
      reference for the cloudrun_f5 zero-shot pipeline.

      LICENSING / RISK: cloning a TTS-output voice may violate the
      upstream provider's TOS (ElevenLabs terms forbid using output to
      train derivative voices). Risks: (a) channel demonetisation if
      the upstream provider's audio fingerprint detector flags us;
      (b) C&D from the original voice actor if they discover the
      derivative. Mitigation paths if a flag fires: revert
      historyrecapped/config.yaml long_form.tts_voice to sarah.wav
      (existing safe female ref) or commission a new male voice ref
      from a CC0/CC-BY archive.org PD audiobook.

      Set as default for historyrecapped/long-form 2026-05-08 by user
      ask "use voice clone" while cloning Sleepy Time History parity.

