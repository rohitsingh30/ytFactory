# ytFactory channel manifest — single source of truth for production channels.
#
# Adding / renaming / removing a production channel = edit this file.
# Every other module derives its view from here (control/scheduler.py
# rotation, pipeline/niches.py mapping, pipeline/niche_schema.py
# defaults). No special-casing per channel anywhere — every row has
# the same shape.

channels:
  - slug: historyrecapped
    youtube_title: HistoryRecapped
    youtube_channel_id: UCnaru-eTkTniyzul0lMJMHQ
    in_rotation: true
    config_yaml: pipeline/channels/historyrecapped.yaml

