name: Today In History
source_adapter: today_in_history

# TTS — F5-TTS-MLX zero-shot voice clone.
# Note: theo.wav was lost in the 2026-05-04 recovery wipe — using
# sarah.wav (female) until a male reference is re-recorded.
tts_provider: cloudrun_chatterbox
tts_voice: pipeline/voice_refs/sarah.wav
tts_ref_text: "Anthropic just plugged Claude directly into Photoshop, Blender, and Ableton. They're called Connectors. Nine of them, shipped together, available on every Claude plan today."
tts_speed: 1.0

# Image gen — Z-Image-Turbo 6B via mflux (MLX-native).
# Replaced sd_turbo (May 2026) — see wiki_oddities.yaml or
# images.validate_provider_config for the why.
image_style_prefix: |
  Classic history-book illustration in muted oil-painting style,
  evoking 19th-century narrative paintings. Hand-painted technique
  with visible brush strokes, subtle canvas texture, and layered
  glazes. Warm amber palette dominated by sepia, burnt sienna,
  faded olive, dusty rose, slate grey, and aged-parchment cream;
  never saturated. Cinematic chiaroscuro lighting with soft warm
  key from upper-left and deep falling shadows in the background.
  A single key historical scene mid-frame, detailed but
  uncluttered, with one or two grounding props placed in the
  foreground for spatial anchor. Every prop is plain and
  unmarked — books are closed with blank covers, banners hang
  blank, parchment scrolls are blurred, walls bear no signage,
  battle standards show no insignia legible to the eye. ZERO
  printed text, numerals, dates, or captions visible in the
  rendered frame.
image_seed: 1923
image_steps: 9  # Z-Image-Turbo spec sweet spot (was 4 — stale laptop carryover).

# Beat shape
beat_target_s: 2.2
beat_max_s: 3.2

# Output
duration_target_s: [12, 22]
output_resolution: [1080, 1920]

# Closer CTA — Today-In-History native. The channel-default AITA
# YTA/NTA verdict frame is wrong (the narrator isn't asking who's
# wrong; the content is informational). User rule 2026-05-24: every
# script narration already ends with a comment-prompting question,
# so the closer panel must NOT duplicate that ask with COMMENT.
# Instead: LIKE (cheap engagement, fits any non-verdict story) +
# SUBSCRIBE-for-more (drives the channel growth ask). Two-clause
# comma split — captions._split_closer_format renders one clause
# per row. Task #30 (2026-05-24): without this override every TIH
# short shipped with the AITA closer because variant YAML's
# closer_format wasn't being read by the spec.extra backfill.
closer_format: "LIKE if you learned, SUBSCRIBE for more history"
closer_hold_s: 1.0

# Source defaults — feed_type "selected" mirrors Wikipedia's main page picks.
source:
  feed: selected
  limit: 8

# ---- Upload (Stage 8) — shipped to MyStoriesAnimated YouTube channel.
upload:
  account: mystoriesanimated
  privacy: public
  made_for_kids: false
  category_id: "27"          # Education
  auto_upload: false         # web/server.py passes --upload per render
  tags: [today in history, history, on this day, animated, shorts, history shorts]
  description_template: |
    {script.hook}

    📖 Source: {raw.url}

    ━━━━━━━━━━━━━━━━━━━━
    🔔 Subscribe for one historical event every day.
    ━━━━━━━━━━━━━━━━━━━━

    #shorts #history #onthisday #todayinhistory
