name: Wiki Oddities
source_adapter: wikipedia

# TTS — F5-TTS-MLX zero-shot voice clone.
# Note: theo.wav was lost in the 2026-05-04 recovery wipe — using
# sarah.wav (female) until a male reference is re-recorded.
tts_provider: cloudrun_chatterbox
tts_voice: pipeline/voice_refs/sarah.wav
tts_ref_text: "Anthropic just plugged Claude directly into Photoshop, Blender, and Ableton. They're called Connectors. Nine of them, shipped together, available on every Claude plan today."
tts_speed: 1.0

# Image gen — Z-Image-Turbo 6B via mflux (MLX-native).
# Replaced sd_turbo (May 2026): SD-Turbo was trained for 512x512 only
# and was producing smudgy charcoal-wash output at this channel's 9:16
# vertical (768x1344). Z-Image-Turbo handles 9:16 natively, hits the
# "vintage etching" style with detail instead of blur, and runs at
# ~half Schnell's RAM. See images.validate_provider_config.
image_style_prefix: |
  Vintage encyclopedia illustration in the style of 19th-century
  hand-engraved book plates. Fine sepia ink lines on aged parchment
  with subtle cream-and-tan paper texture. Cross-hatching for
  shadow, parallel-line stippling for tone, never flat fills.
  Muted sepia palette: warm brown, faded ochre, soft cream,
  parchment ecru; one optional warm accent fill (a single touch
  of dusty rose or olive). Soft diffused window-light from the
  upper-left with gentle falloff. Single subject centered mid-
  frame, detailed but minimalist, with one grounding prop or
  architectural detail in the foreground for depth. Every
  object is plain and unmarked — open books show no readable
  print, scientific apparatus carries no labels, maps render
  geography without place names, banners hang blank. ZERO
  printed text, numerals, or annotations visible in the
  rendered frame.
image_seed: 137
image_steps: 9  # Z-Image-Turbo spec sweet spot (was 4 — stale laptop carryover).

# Beat shape
beat_target_s: 2.0
beat_max_s: 3.0

# Output
duration_target_s: [12, 22]
output_resolution: [1080, 1920]

# Source defaults — what the /make-script skill should pull by default.
source:
  page: unusual_deaths_21c   # preset key in sources/wikipedia.py
  limit: 10

# ---- Upload (Stage 8) — shipped to MyStoriesAnimated YouTube channel.
upload:
  account: mystoriesanimated
  privacy: public
  made_for_kids: false
  category_id: "27"          # Education
  auto_upload: false         # web/server.py passes --upload per render
  tags: [wiki, oddities, history, weird, animated, shorts, did you know, history shorts]
  description_template: |
    {script.hook}

    📖 Source: {raw.url}

    ━━━━━━━━━━━━━━━━━━━━
    🔔 Subscribe for more strange-but-true stories.
    ━━━━━━━━━━━━━━━━━━━━

    #shorts #history #wikipedia #didyouknow #oddities
