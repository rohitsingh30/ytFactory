# Cosmos Decoded — physics + space "how did we know?" channel.
#
# Channel slug `cosmosdecoded` (matches the YouTube display name
# Cosmos Decoded, lowercased + concatenated). All paths use
# `cosmosdecoded`: cosmosdecoded/{raw,narrations,cache,shorts,
# uploads,branding,footage,shotlist,scripts,learnings,music,long_form}.
#
# Format pivot 2026-05-05: footage-only channel. Every video pairs a
# specific physics prediction with the experiment / mission /
# observation that confirmed it. Three-act structure:
#   prediction (theory) -> experiment (the test) -> consequence
#   (what it changed in physics or engineering practice)
#
# This is NOT the SportsStoriesAnimated hybrid recipe and NOT the
# MyStoriesAnimated illustrated path. Production renders are 100%
# footage-only: PD photography, archival film, NASA / ESA / CERN
# imagery, lab-notebook scans, paper page screenshots, with our
# narrator on top and word-by-word captions (Shorts) or sentence-
# level captions (long-form).
#
# NO AI image generation. Every visual must be sourceable from:
#   * NASA Image and Video Library (PD)
#   * ESA / Hubble / JWST releases (CC-BY-SA-IGO)
#   * Wikimedia Commons (CC-BY-SA, attribution per beat)
#   * arXiv preprint PDFs (paper screenshots are fair use as
#     editorial commentary; keep <8s on screen)
#   * Library of Congress + LIGO / CERN open archives
#   * National Archives Record Group 255 (NASA AV holdings, PD)
#   * Period photography (Eddington 1919 plates, Cavendish notes etc.)
#   * Stock b-roll from Pexels / Pixabay / Storyblocks
#
# See learnings/channel.md for the full source palette + wedge.

name: Cosmos Decoded
source_adapter: cosmosdecoded_manual  # manual curator flow, no auto-pull yet

# render_style: footage_only — workers/heavy/render_short.py routes this
# channel through scripts/historyrecapped/render_footage_only.py. Each
# slug needs a sidecar at cosmosdecoded/shotlist/<slug>.json with
# source_url + windows[] (each {in_s, out_s, match_text}).
render_style: footage_only

# Branding assets at cosmosdecoded/branding/
#   icon_800.png         — 800x800 channel avatar (gold orbit / formula mark)
#   banner_2560x1440.png — 2560x1440 banner, content fitted to mobile-safe 1546x423
# Re-render via cosmosdecoded/scripts/branding.py once authored.

# Narrator visual mode — voice_only. Cosmos Decoded is a third-person
# documentary voice-over; on-screen visuals are PD photography, paper
# scans, lab equipment, telescopes, mission control, satellite imagery.
# Suppresses any "the narrator", "a physicist explaining", "a host"
# depictions. Every beat must show a real instrument, named scientist,
# observatory, satellite, or paper page.
narrator_visual_mode: voice_only

# ---- TTS — Shorts: Kokoro am_michael (sober explainer male) ------------
# Same voice as HistoryRecapped Shorts. Steady, enunciating, confident
# male, zero-API local synthesis. Long-form runs F5-TTS-MLX strictly
# (see long_form: block below; render_long_form.py rejects any other
# provider).
tts_provider: kokoro
tts_voice: am_michael
tts_speed: 1.0

# ---- Image gen — DISABLED for production ------------------------------
# Cosmos Decoded is footage-only by design. The block below is kept
# inert so the existing pipeline scaffolding (workers, schema validators)
# doesn't choke on missing keys, but render_style: footage_only routes
# around image-gen entirely. NEVER flip render_style to image_gen on
# this channel — the wedge is "real photographs of real experiments".
# Cargo-culted illustration would dilute the document-led signature.
image_provider: z_image_turbo
image_seed: 1919  # Eddington's eclipse year — symbolic only, image-gen unused
image_steps: 4
image_width: 768
image_height: 1344
image_min_mean_luminance: 50.0
image_min_p75_luminance: 90.0

# ---- Beat shape -------------------------------------------------------
# 3.0s target / 4.5s max — same cadence as HistoryRecapped Shorts.
# Physics topics need a beat to absorb each visual (paper page,
# satellite shot, equation chyron); faster cadence loses the audience
# who came for the "wait, that's the actual paper?" moment.
beat_target_s: 3.0
beat_max_s: 4.5

# ---- Output -----------------------------------------------------------
# 50-60s — the 2026 Shorts sweet spot (see project_shorts_algo_2026
# in cross-channel memory).
duration_target_s: [50, 60]
output_resolution: [1080, 1920]

# Hold the closer caption for a beat after the audio ends so viewers
# read the CTA before the loop restarts.
closer_hold_s: 1.5

# ---- Closer panel — engagement split, science-curious ------------------
# Match HistoryRecapped's two-line LIKE/SUBSCRIBE format. Curiosity-
# bait CTA tuned to the audience: "which experiment next" is the
# audience-curating question that drove HistoryRecapped's comment
# section, ported to physics. SUBSCRIBE first because a faceless
# science channel monetizes on subs > likes (algorithm rewards
# session retention, not engagement velocity).
closer_format: "SUBSCRIBE for more decoders\nLIKE if this changed how you see physics"

# Cosmos Decoded narration is third-person documentary, not first-person
# AITA. Same opt-out as HistoryRecapped + Sports.
script_check_strict: false

# ---- Upload (Stage 8) — NOT YET WIRED ---------------------------------
# Channel pending OAuth (user is creating the YouTube channel separately).
# Once authed, drop the resulting account label here as `account:` and
# flip auto_upload to true after a few mocks ship clean.
#
# privacy: private until format sign-off. Once promoted: privacy: public
# per feedback_upload_public_default.md. category_id 28 = Science &
# Technology (correct fit; NOT 27 Education — Sci/Tech has higher RPM).
# min_score: 7 — same bar as HistoryRecapped because the document/photo
# specificity is this channel's USP.
upload:
  account: cosmosdecoded         # placeholder; OAuth will overwrite
  privacy: private               # promote to public after format sign-off
  made_for_kids: false
  category_id: "28"              # Science & Technology
  auto_upload: false
  min_score: 7
  tags:
    - physics
    - space
    - science
    - astronomy
    - cosmology
    - history of science
    - physics shorts
    - science shorts
    - science explained
    - science documentary
    - relativity
    - quantum
    - black holes
    - gravitational waves
    - shorts
  description_template: |
    {script.hook}

    📖 Source: {raw.url}

    ━━━━━━━━━━━━━━━━━━━━
    🔭 SUBSCRIBE for more decoders
    ✨ LIKE if this changed how you see physics
    ━━━━━━━━━━━━━━━━━━━━

    #shorts #physics #space #science #astronomy #cosmosdecoded

# ---- Long-form mode ---------------------------------------------------
# Cosmos Decoded also publishes 25-40 min long-form "How We Knew" deep
# dives to the SAME channel. 16:9 horizontal, sober narrator, soft
# ambient bed, sentence captions, two inline like/sub asks (one
# ~3-4 min in, one closer) per long_form_support_asks pattern from
# HistoryRecapped.
#
# Renderer: scripts/historyrecapped/render_long_form.py
#   .venv/bin/python scripts/historyrecapped/render_long_form.py \
#       --channel cosmosdecoded --slug <long-slug>
# (The renderer is channel-parametric — `--channel cosmosdecoded`
# pulls this config block.)
#
# See learnings/channel.md for the "How We Knew" three-act template
# and learnings/long_form_format.md (TBD) for sourcing rules.
long_form:
  # Footage-only render mode. Same path as HistoryRecapped sleep
  # long-form post-2026-05-04 image_panels retirement.
  render_mode: archival_footage

  # Voice — F5-TTS-MLX zero-shot voice clone of sarah.wav. Same ref as
  # HistoryRecapped long-form so we don't burn a second voice slot.
  # Cosmos Decoded long-form is calm-explainer cadence (NOT sleep-mode):
  # speed=1.0 + atempo=1.0 → ~150 wpm "Veritasium without the host"
  # tempo. NEVER use sleep cadence (0.95 + atempo=0.85) on this channel
  # — physics audience expects engaged narration, not bedtime narration.
  tts_provider: f5_tts
  tts_voice: pipeline/voice_refs/sarah.wav
  tts_ref_text: "Tonight we travel to the Western Front of the Great War. Speak softly. Let the lamp grow dim. Slow your breathing. We will walk together from the warm meadows"
  tts_speed: 1.0
  tts_post_atempo: 1.0
  tts_chunk_target_chars: 380
  tts_chunk_join_silence_s: 0.4

  # Audio mix
  audio_narration_db: -6
  audio_music_bed_db: -30        # quieter than sleep-mode (-28); explainer
                                 # mode wants narration to dominate
  audio_source_mix: 0.0          # mute source film narration (ContentID safety)

  # Output
  duration_target_s: [1500, 2400]   # 25-40 min (vs 60-120 min for sleep)
  output_resolution: [1920, 1080]   # 16:9 horizontal — long-form, NOT Shorts
  output_fps: 30

  # Captions ON for long-form. Sentence-level white sans-serif (NOT the
  # yellow italic sleep-mode style) — physics audience watches eyes-open
  # and benefits from on-screen equation / paper-quote captions.
  captions_enabled: true
  caption_style:
    text_rgba: [255, 255, 255, 255]    # white
    italic: false

  # Channel watermark — faint white sans-serif top-right.
  watermark:
    enabled: true
    text: "COSMOS DECODED"
    font_size: 28
    text_rgba: [255, 255, 255, 140]
    margin: 32

  # Music bed — slow ambient (no melodic motion that competes with
  # equation explanation). Drop royalty-free wavs into cosmosdecoded/music/.
  music_bed_default: aether-loop.wav

  # Footage cache for long-form sources.
  footage_dir: footage/long_sources

  # ---- Visual signature — cool dawn + observatory blue ------------------
  # Distinct from HistoryRecapped's warm-firelight grade. Cosmos Decoded
  # leans cool (telescope blue, midnight, lab fluorescent) with warm
  # accents on actual instruments (vacuum tube glow, accelerator beam
  # lines). Vignette kept light — observatory + paper imagery already
  # has good edge contrast.
  visual_grade:
    enabled: true
    filter: "eq=gamma=1.02:saturation=0.92,colorbalance=rs=-0.04:gs=-0.02:bs=0.10:rm=-0.02:gm=0.00:bm=0.06:rh=0.04:gh=0.02:bh=-0.02,vignette=PI/6"

  # Long-form upload metadata — Sci/Tech category, decoder-style tags.
  upload:
    privacy: private
    made_for_kids: false
    category_id: "28"              # Science & Technology
    auto_upload: false
    tags:
      - physics documentary
      - space documentary
      - science documentary
      - history of physics
      - history of science
      - relativity
      - quantum mechanics
      - cosmology
      - astronomy
      - physics explained
      - how we knew
      - decoder
      - long form science
      - science long form
      - science deep dive
    # description_template tokens (resolved at upload time):
    #   {script.title}    — narration JSON `title`
    #   {script.hook}     — narration JSON `hook`
    #   {script.sources}  — narration JSON `sources` array as bullets
    #   {chapters_block}  — auto from narration `chapters`: "MM:SS Title"
    description_template: |
      {script.hook}

      How did we know? Every Cosmos Decoded long-form pairs a
      physics prediction with the specific experiment, mission, or
      observation that confirmed it — using the actual paper, the
      actual photograph, the actual telemetry.

      ━━━━━━━━━━━━━━━━━━━━
      🔭 SUBSCRIBE for more decoders
      ✨ LIKE if this changed how you see physics
      ━━━━━━━━━━━━━━━━━━━━

      📖 Chapters:
      {chapters_block}

      📚 Sources:
      {script.sources}

      A note on process: we use AI tools to help with research drafting,
      narration, and visual selection, while we shape the narrative and
      verify the facts against the original papers and primary documents.
      These videos blend research with storytelling — they are not a
      formal academic source.

      #physics #space #science #astronomy #cosmology #cosmosdecoded
