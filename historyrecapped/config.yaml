# History Recapped — documentary war-history Shorts.
# Channel slug `historyrecapped` (matches the YouTube display name
# History Recapped, lowercased + concatenated). All paths use
# `historyrecapped`: channels/, data/intermediate/, data/uploads/,
# scripts/, OAuth account, niche key.
#
# Format pivot 2026-05-03: this channel does NOT use the
# SportsStoriesAnimated hybrid recipe (illustrated beats + 1 footage
# cut at the climax). Production renders are 100% archival footage
# with our Cartesia narrator on top, word-by-word captions, and
# inline national-flag emojis. See feedback_history_recapped_format.md
# for the rule. The image-gen config below is kept for future hybrid
# experiments, but the production scripts skip image-gen entirely.
#
# Production workflow — bypasses make_shorts.py for ~25s renders
# instead of 30+ min image-gen waste. Reproducible scripts at
# historyrecapped/scripts/ — see historyrecapped/scripts/README.md for the full
# recipe. Summary:
#   1. Hand-author raw + script JSON under historyrecapped/.
#      Closer must be 3-part: LIKE ask + SUBSCRIBE ask + question
#      ending in ?. Pattern: "LIKE if you learned something. SUBSCRIBE
#      for more deep dives. Could you have done it at <X>?"
#   2. Find HD archival source on YouTube; download once into
#      sportstoriesanimated/footage/sources/
#      (cache currently shared across channels). Whisper the source
#      audio to find visual sequences by narration cue.
#   3. historyrecapped/scripts/build_100footage.sh — concat 5-7 trim
#      windows with the blurred-letterbox 9:16 filter, uniform 30fps.
#   4. historyrecapped/scripts/regen_audio_caps.py — Cartesia TTS +
#      whisper alignment + word PNG render. ~25s total.
#   5. historyrecapped/scripts/final_v2.py — re-mux narration onto silent
#      video (tpad to match length), inline-flag-composite relevant
#      word PNGs, burn captions with cut-aware clamping (each word
#      ends 100ms before its next scene cut so captions don't bleed
#      across visual transitions).
#   6. historyrecapped/scripts/upload.py — public, category 27.
#
# Sourcing note: use HD restorations from public-archive YouTube
# channels (US National Archives, IWM, Smithsonian, "WW2 in Color").
# Do NOT use anything that visibly identifies casualties or civilians.
# Source audio is muted (audio_mix: 0.0) — the source's own
# documentary narration would compete with ours.

name: History Recapped
source_adapter: historyrecapped_manual  # manual curator flow, no auto-pull
# Branding assets at historyrecapped/branding/
#   icon_800.png         — 800x800 channel avatar (circular medal mark + name)
#   banner_2560x1440.png — 2560x1440 banner, content fitted to mobile-safe 1546x423

# Narrator visual mode — war stories are third-person voice-overs.
# The narrator is a documentary VOICE; on-screen visuals are the
# illustrated battle scenes + the real archival cut-in. Mirrors sports.
# This switches pipeline/prompts.py to voice-only authoring:
#   * suppresses any channel-wide character_description (no narrator persona)
#   * forbids "the narrator", "a man watching", "a historian" etc.
#   * forces every beat to depict a named real person, equipment, or
#     pure scene shot — no on-screen analyst.
# See feedback_sports_no_narrator_on_screen.md for the regression
# we're preventing.
narrator_visual_mode: voice_only

# ---- TTS — sober documentary narrator ---------------------------------
# Cartesia Sonic-2 + "Theo" (steady, enunciating, confident male).
# Migrated 2026-05-03 from kokoro/am_michael. tts_speed=0.95 maps to
# Cartesia "slow" — slightly slower than sports for gravitas; cadence
# sells the weight of the moment. Requires CARTESIA_API_KEY env var.
tts_provider: cartesia
tts_voice: 79f8b5fb-2cc8-479a-80df-29f7a7cf1a3e  # Theo, US male narrator
tts_speed: 0.95

# ---- Image gen — illustrated military-history-book aesthetic ----------
# Reference: Osprey Publishing combat plates + period war-art (Howard
# Brodie, Tom Lea). NOT the Tifo soft-sketch palette — that vibe is
# for stoppage-time celebrations, not Omaha Beach. We need ink hatching,
# muted earth/military tones, dramatic chiaroscuro lighting.
#
# Z-Image-Turbo 6B via mflux. Same provider as sports + today_in_history.
# DO NOT switch to motion_provider — channel design is illustrated
# stills between archival cut-ins; AnimateDiff is rejected for this
# channel for the same reason as sports.
image_provider: z_image_turbo
#
# CLASS-OF-BUG note (channel bring-up): the bare phrase "war scene"
# pushes diffusion toward generic medieval/fantasy battles or video-game
# screenshots. We pin the ERA explicitly per-prompt (e.g. "1944
# Normandy", "1940 RAF Fighter Command") and pin EQUIPMENT explicitly
# (M1 Garand, Spitfire Mk I, T-34/76) so the model doesn't drift to
# anachronistic kit. Keep the YAML prefix focused on STYLE; the era +
# equipment lock comes from the script's per-beat scene strings, server-
# side enforced after LLM authoring (mirrors the sports kit_lock pattern
# from feedback_sports_cast_locked_tokens.md).
#
# CLASS-OF-BUG (diffusion negation trap, feedback_diffusion_negation_trap.md):
# z_image_turbo amplifies any token regardless of "no"/"without". Style
# prefix below is pure positive descriptors — never "no gore", "no
# blood". To suppress imagery we describe what we WANT (formation
# silhouette, wide landscape, equipment close-up).
image_style_prefix: |
  vintage illustrated military history book plate, ink hatching with
  watercolor wash, muted military palette of khaki olive sepia
  charcoal and dust-red, dramatic chiaroscuro lighting, period-accurate
  uniforms and equipment, wide compositional framing, single subject
  focus, no text, sober documentary tone (never video-game screenshot,
  never fantasy battle, never modern operator)
image_seed: 1944  # year of D-Day, Battle of the Bulge, Iwo Jima — locks character look
image_steps: 4    # M2 Max compile-disabled path; matches sports + today_in_history
# Z-Image-Turbo caps at 1344 per dim; compose upscales to the
# 1080x1920 output_resolution in the final render.
image_width: 768
image_height: 1344

# QC luminance thresholds — relaxed for chiaroscuro war-art aesthetic.
# pipeline/quality_gate.py defaults (80 mean / 130 P75) are tuned for
# AITA pastel-bright cartoons; our khaki/sepia/charcoal plates legitimately
# render dark and were hitting 3-4 retries per beat (~30 min/beat). Lowering
# these floors keeps the dark-frame regression catch but stops fighting the
# channel's deliberate look. Re-tighten if we see actual all-black frames.
image_min_mean_luminance: 50.0
image_min_p75_luminance: 90.0

# ---- Beat shape -------------------------------------------------------
# Slightly slower than sports (2.2s) — war stories are heavier; viewers
# need a beat to absorb each illustrated plate. Mirrors today_in_history.
beat_target_s: 3.0
beat_max_s: 4.5

# ---- Output -----------------------------------------------------------
# 50-60s — the 2026 Shorts sweet spot (project_shorts_algo_2026).
duration_target_s: [50, 60]
output_resolution: [1080, 1920]

# Hold the closer caption for a beat after the audio ends so viewers
# read the CTA before the loop restarts.
closer_hold_s: 1.5

# ---- Closer panel — engagement split, war-respectful ------------------
# LIKE / COMMENT split per feedback_aita_closer_panel.md. War context
# means we avoid verdict-bait ("WHO WAS RIGHT") and instead drive
# audience-curating engagement (which battle next, which front).
# Two lines separated by \n; first = LIKE side, second = COMMENT side.
closer_format: "SUBSCRIBE for more deep dives\nLIKE if you learned something"

# War stories are third-person documentary narration ("On the morning
# of June 6th, 1944…") rather than AITA-style first-person hooks.
# They don't fit the strict AITA hook patterns the script_check
# strict gate enforces — opt out, same as sports. closer_format
# still drives the panel render; script_check.py keeps issues at
# warning severity instead of failing the render.
script_check_strict: false

# ---- Upload (Stage 8) — LIVE ------------------------------------------
# Channel SHIPPED 2026-05-03 (first upload: youtu.be/bc7lopoWSY4).
# Owning Google account: rsinghtomar54@gmail.com. To re-auth:
#   .venv/bin/python historyrecapped/scripts/auth.py
#      (uses fixed callback port 8089 — see reference_oauth_setup.md)
#   3. Flip auto_upload below to true once a few have shipped clean.
#
# privacy: private until a couple of mocks land and the user signs off
# on the format. Once promoted: privacy: public per
# feedback_upload_public_default.md. category_id 27 is Education
# (better than 22/People & Blogs for documentary content; news-class
# 25 risks demonetization on combat footage).
# min_score: 7 — same bar as sports because the archival cut-in is
# this channel's USP and a missing/mistimed cut breaks the format.
upload:
  account: historyrecapped
  privacy: private          # promote to public after format sign-off
  made_for_kids: false
  category_id: "27"          # Education
  auto_upload: false
  min_score: 7
  tags:
    - history
    - history shorts
    - military history
    - world war 2
    - ww2
    - war history
    - archival footage
    - documentary shorts
    - educational shorts
    - shorts
  description_template: |
    {script.hook}

    📖 Source: {raw.url}

    ━━━━━━━━━━━━━━━━━━━━
    🎖️ LIKE if you learned something
    🔔 SUBSCRIBE for more deep dives
    ━━━━━━━━━━━━━━━━━━━━

    #shorts #history #ww2 #militaryhistory #warhistory #documentary #historyrecapped
