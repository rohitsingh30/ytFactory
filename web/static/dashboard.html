<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ytFactory — live dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif; }
  .stat-num { font-variant-numeric: tabular-nums; }
  .video-card { transition: transform .15s ease, box-shadow .15s ease; }
  .video-card:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0,0,0,.45); }
  .pulse-dot { animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  .channel-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 9999px;
    font-size: 12px; font-weight: 500;
  }
  .skeleton {
    background: linear-gradient(90deg, rgb(30 41 59), rgb(51 65 85), rgb(30 41 59));
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

<header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-10">
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="text-xl">📊</div>
      <div>
        <h1 class="text-lg font-semibold">ytFactory · Live Dashboard</h1>
        <div class="text-xs text-slate-400" id="last-fetched">…</div>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <a href="/" class="text-sm text-slate-400 hover:text-slate-200">← back to studio</a>
      <button id="refresh-btn"
        class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-sm font-medium transition disabled:opacity-50 disabled:cursor-wait">
        Refresh from YouTube
      </button>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-6 py-8 space-y-10">
  <!-- ROLLUP -->
  <section id="rollup" class="grid grid-cols-2 md:grid-cols-5 gap-4">
    <div class="rounded-xl border border-slate-800 bg-slate-900/60 p-5">
      <div class="text-xs uppercase tracking-wider text-slate-400">Subscribers</div>
      <div class="text-3xl font-semibold mt-1 stat-num text-violet-300" id="rollup-subs">—</div>
    </div>
    <div class="rounded-xl border border-slate-800 bg-slate-900/60 p-5">
      <div class="text-xs uppercase tracking-wider text-slate-400">Videos shipped</div>
      <div class="text-3xl font-semibold mt-1 stat-num" id="rollup-videos">—</div>
    </div>
    <div class="rounded-xl border border-slate-800 bg-slate-900/60 p-5">
      <div class="text-xs uppercase tracking-wider text-slate-400">Total views</div>
      <div class="text-3xl font-semibold mt-1 stat-num text-sky-300" id="rollup-views">—</div>
    </div>
    <div class="rounded-xl border border-slate-800 bg-slate-900/60 p-5">
      <div class="text-xs uppercase tracking-wider text-slate-400">Total likes</div>
      <div class="text-3xl font-semibold mt-1 stat-num text-pink-300" id="rollup-likes">—</div>
    </div>
    <div class="rounded-xl border border-slate-800 bg-slate-900/60 p-5">
      <div class="text-xs uppercase tracking-wider text-slate-400">Total comments</div>
      <div class="text-3xl font-semibold mt-1 stat-num text-emerald-300" id="rollup-comments">—</div>
    </div>
  </section>

  <!-- CHANNEL SECTIONS -->
  <section id="channels" class="space-y-12">
    <!-- filled by JS -->
  </section>

  <div id="empty" class="hidden text-center py-20 text-slate-500">
    <div class="text-4xl mb-3">📭</div>
    <div>No uploads yet.</div>
  </div>
</main>

<script>
const fmt = (n) => (n == null) ? "—" : n.toLocaleString();
const fmtRel = (iso) => {
  if (!iso) return "";
  const t = new Date(iso).getTime();
  const diff = Math.max(0, (Date.now() - t) / 1000);
  if (diff < 60) return Math.round(diff) + "s ago";
  if (diff < 3600) return Math.round(diff / 60) + "m ago";
  if (diff < 86400) return Math.round(diff / 3600) + "h ago";
  return Math.round(diff / 86400) + "d ago";
};

const CHANNEL_LABELS = {
  historyrecapped: "History Recapped",
  hindutavaanimated: "HindutavaAnimated",
  mystoriesanimated: "MyStoriesAnimated",
  rhymetimejunction: "Rhyme Time Junction",
  sportstoriesanimated: "SportsStoriesAnimated",
};
const CHANNEL_COLORS = {
  historyrecapped:       "from-amber-700 to-stone-900 ring-amber-300/40",
  hindutavaanimated:     "from-orange-600 to-rose-900 ring-orange-300/40",
  mystoriesanimated:     "from-rose-500 to-orange-500 ring-rose-300/40",
  rhymetimejunction:     "from-fuchsia-500 to-purple-600 ring-fuchsia-300/40",
  sportstoriesanimated:  "from-emerald-600 to-teal-700 ring-emerald-300/40",
};

// Last successful fetch state — kept on the module so a 5s ticker can
// re-render the relative-time string without waiting for the next /api
// round-trip. Without this, the "Xs ago" label looked frozen between
// 60s polls and made auto-refresh appear broken.
let lastState = { latest_fetch: null, err: null };

function paintLastFetched() {
  const lf = document.getElementById("last-fetched");
  const { latest_fetch, err } = lastState;
  if (err) {
    lf.textContent = "⚠ " + err
      + (latest_fetch ? " · cache last updated " + fmtRel(latest_fetch) : "");
    lf.className = "text-xs text-amber-400";
  } else if (latest_fetch) {
    lf.textContent = "live YouTube data · last refreshed " + fmtRel(latest_fetch);
    lf.className = "text-xs text-slate-400";
  } else {
    lf.textContent = "no stats cached yet — click refresh";
    lf.className = "text-xs text-slate-400";
  }
}

function renderRollup(d) {
  document.getElementById("rollup-subs").textContent = fmt(d.totals.subscribers);
  document.getElementById("rollup-videos").textContent = fmt(d.totals.videos);
  document.getElementById("rollup-views").textContent = fmt(d.totals.views);
  document.getElementById("rollup-likes").textContent = fmt(d.totals.likes);
  document.getElementById("rollup-comments").textContent = fmt(d.totals.comments);
  // Local server returns `refresh_error`; prod control plane returns
  // `warning`. Either means stats may be stale — surface to the user.
  lastState = { latest_fetch: d.latest_fetch || null, err: d.refresh_error || d.warning || null };
  paintLastFetched();
}

function videoCard(v) {
  const date = v.uploaded_at ? new Date(v.uploaded_at).toLocaleDateString(undefined, {
    year: 'numeric', month: 'short', day: 'numeric'
  }) : "";
  const PRIVACY_STYLE = {
    public:           "bg-emerald-700/40 text-emerald-200 ring-emerald-500/30",
    unlisted:         "bg-amber-700/40  text-amber-200  ring-amber-500/30",
    private:          "bg-rose-700/40   text-rose-200   ring-rose-500/30",
    "private/unlisted": "bg-slate-700/40 text-slate-200 ring-slate-500/30",
  };
  const pCls = PRIVACY_STYLE[v.privacy] || "bg-slate-800 text-slate-300";
  const privacy = v.privacy ? `<span class="text-[10px] px-2 py-0.5 rounded ring-1 ${pCls}">${v.privacy}</span>` : "";
  const drift = (v.privacy && v.privacy_record && v.privacy !== v.privacy_record)
    ? `<span class="text-[10px] text-amber-400/80" title="Upload record said '${v.privacy_record}' but YouTube reports '${v.privacy}' now">⚠</span>`
    : "";
  return `
    <a href="${v.watch_url}" target="_blank" rel="noopener"
       class="video-card block rounded-xl border border-slate-800 bg-slate-900/40 overflow-hidden hover:border-slate-600">
      <div class="aspect-video bg-slate-800 relative">
        <img src="${v.thumbnail}" alt="" class="w-full h-full object-cover" loading="lazy" />
        <div class="absolute top-2 right-2 flex items-center gap-1">${drift}${privacy}</div>
      </div>
      <div class="p-3">
        <div class="text-sm font-medium leading-snug line-clamp-2 mb-2">${v.title}</div>
        <div class="flex items-center gap-3 text-xs text-slate-400 mb-2">
          <span>${date}</span>
          <span class="opacity-50">·</span>
          <a href="${v.studio_url}" target="_blank" rel="noopener"
             onclick="event.stopPropagation()"
             class="hover:text-slate-200 underline-offset-2 hover:underline">Studio</a>
        </div>
        <div class="grid grid-cols-3 gap-2 text-center">
          <div class="rounded bg-slate-800/60 py-1.5">
            <div class="text-base stat-num font-semibold text-sky-300">${fmt(v.stats.views)}</div>
            <div class="text-[10px] text-slate-500 uppercase tracking-wide">Views</div>
          </div>
          <div class="rounded bg-slate-800/60 py-1.5">
            <div class="text-base stat-num font-semibold text-pink-300">${fmt(v.stats.likes)}</div>
            <div class="text-[10px] text-slate-500 uppercase tracking-wide">Likes</div>
          </div>
          <div class="rounded bg-slate-800/60 py-1.5">
            <div class="text-base stat-num font-semibold text-emerald-300">${fmt(v.stats.comments)}</div>
            <div class="text-[10px] text-slate-500 uppercase tracking-wide">Comments</div>
          </div>
        </div>
      </div>
    </a>
  `;
}

function channelSection(c) {
  const label = CHANNEL_LABELS[c.account] || c.account;
  const grad = CHANNEL_COLORS[c.account] || "from-slate-700 to-slate-900 ring-slate-400/30";
  // Subs: hidden-by-creator → "subs hidden"; null → "—" (not yet fetched).
  const subText = c.subscribers_hidden
    ? "subs hidden"
    : (c.subscribers == null ? "— subs" : fmt(c.subscribers) + " sub" + (c.subscribers === 1 ? "" : "s"));
  return `
    <div>
      <div class="flex items-end justify-between mb-4 pb-3 border-b border-slate-800">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-gradient-to-br ${grad} ring-2 grid place-items-center text-white font-bold text-lg shadow-lg">
            ${label.split(/\s+/).map(w => w[0]).slice(0,2).join('')}
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h2 class="text-lg font-semibold">${label}</h2>
              <span class="channel-pill bg-violet-700/40 text-violet-200 ring-1 ring-violet-500/30">👥 ${subText}</span>
            </div>
            <div class="text-xs text-slate-500">${c.video_count} video${c.video_count===1?'':'s'} · ${fmt(c.totals.views)} views · ${fmt(c.totals.likes)} likes · ${fmt(c.totals.comments)} comments</div>
          </div>
        </div>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
        ${c.videos.map(videoCard).join("")}
      </div>
    </div>
  `;
}

const REFRESH_MS = 60_000;
let inflight = false;
let pollTimer = null;

async function load(refresh = false) {
  // Drop overlapping calls — if a previous fetch is still running, skip.
  // Without this, a stalled YouTube API call could pile up duplicate
  // requests every 60s.
  if (inflight) return;
  inflight = true;
  const btn = document.getElementById("refresh-btn");
  btn.disabled = true;
  if (refresh) btn.textContent = "Refreshing…";
  try {
    const url = "/api/dashboard/videos" + (refresh ? "?refresh=true" : "");
    const r = await fetch(url);
    const d = await r.json();
    renderRollup(d);
    const root = document.getElementById("channels");
    if (!d.channels || !d.channels.length) {
      document.getElementById("empty").classList.remove("hidden");
      root.innerHTML = "";
    } else {
      document.getElementById("empty").classList.add("hidden");
      root.innerHTML = d.channels.map(channelSection).join("");
    }
  } catch (e) {
    console.error("dashboard load failed", e);
    lastState = { ...lastState, err: "load failed: " + e.message };
    paintLastFetched();
  } finally {
    inflight = false;
    btn.disabled = false;
    btn.textContent = "Refresh from YouTube";
  }
}

function schedulePoll() {
  if (pollTimer) clearTimeout(pollTimer);
  // Don't poll while the tab is hidden — the user can't see updates and
  // we'd waste YouTube API quota. visibilitychange resumes us on return.
  if (document.hidden) { pollTimer = null; return; }
  pollTimer = setTimeout(async () => {
    await load(true);
    schedulePoll();
  }, REFRESH_MS);
}

document.getElementById("refresh-btn").addEventListener("click", async () => {
  await load(true);
  schedulePoll();
});

// Pause when hidden; force-refresh + restart polling when the tab comes
// back into focus so users coming back to the dashboard see live numbers
// immediately, not whatever was cached 60s ago.
document.addEventListener("visibilitychange", async () => {
  if (document.hidden) {
    if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
  } else {
    await load(true);
    schedulePoll();
  }
});

// Tick the "Xs ago" label every 5s so the user can see auto-refresh
// progressing between actual fetches. Doesn't hit the network.
setInterval(paintLastFetched, 5_000);

// Always hit YouTube on page load + every 60s so view/like/comment counts
// stay live. videos.list?part=statistics is 1 quota unit per batched call
// (≤50 ids), so refreshing every minute is well under the 10k daily cap.
(async () => { await load(true); schedulePoll(); })();
</script>
</body>
</html>
