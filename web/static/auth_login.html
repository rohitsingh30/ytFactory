<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ytFactory · Sign in</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen grid place-items-center font-sans">
  <main class="max-w-md w-full p-8 bg-slate-900/60 border border-slate-800 rounded-2xl">
    <h1 class="text-2xl font-semibold tracking-tight">ytFactory</h1>
    <p class="text-slate-400 text-sm mt-2 mb-8">
      Sign in with Google to continue.
      Access is invite-only — if you don't have an approved account yet,
      you'll see a "request access" page after sign-in.
    </p>

    <a href="/api/auth/google/login"
       class="flex items-center justify-center gap-3 w-full px-4 py-3
              bg-white text-slate-900 hover:bg-slate-100 transition
              rounded-lg font-medium text-sm">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.5 29.3 4.5 24 4.5 13.2 4.5 4.5 13.2 4.5 24S13.2 43.5 24 43.5 43.5 34.8 43.5 24c0-1.2-.1-2.4-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.4 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.5 29.3 4.5 24 4.5 16.4 4.5 9.8 8.7 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 43.5c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.4-4.5 2.2-7.2 2.2-5.3 0-9.7-3.4-11.3-8L6 32.2C9.4 38.4 16.1 43.5 24 43.5z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.6l6.2 5.2c-.4.4 6.6-4.8 6.6-14.8 0-1.2-.1-2.4-.4-3.5z"/>
      </svg>
      <span>Sign in with Google</span>
    </a>

    <p class="text-xs text-slate-500 mt-8" id="error-msg"></p>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const err = params.get('error');
    if (err) {
      const el = document.getElementById('error-msg');
      if (err === 'denied') el.textContent = 'Your access request was denied.';
      else el.textContent = 'Sign-in failed: ' + err;
    }
  </script>
</body>
</html>
