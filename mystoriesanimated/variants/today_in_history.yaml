name: Today In History
source_adapter: today_in_history

# TTS — Cartesia Sonic-2 + "Theo" (steady, enunciating documentary-style
# male). Requires CARTESIA_API_KEY env var at render time.
tts_provider: cartesia
tts_voice: 79f8b5fb-2cc8-479a-80df-29f7a7cf1a3e  # Theo, US male narrator
tts_speed: 1.0

# Image gen — Z-Image-Turbo 6B via mflux (MLX-native).
# Replaced sd_turbo (May 2026) — see wiki_oddities.yaml or
# images.validate_provider_config for the why.
image_provider: z_image_turbo
image_style_prefix: |
  classic history-book illustration, muted oil-painting style, warm
  amber palette, cinematic lighting, a single key historical scene,
  detailed but uncluttered, no text or captions
image_seed: 1923
image_steps: 4  # See aita_animated.yaml comment. M2 Max compile-disabled path.

# Beat shape
beat_target_s: 2.2
beat_max_s: 3.2

# Output
duration_target_s: [12, 22]
output_resolution: [1080, 1920]

# Source defaults — feed_type "selected" mirrors Wikipedia's main page picks.
source:
  feed: selected
  limit: 8

# ---- Upload (Stage 8) — shipped to MyStoriesAnimated YouTube channel.
upload:
  account: mystoriesanimated
  privacy: public
  made_for_kids: false
  category_id: "27"          # Education
  auto_upload: false         # web/server.py passes --upload per render
  tags: [today in history, history, on this day, animated, shorts, history shorts]
  description_template: |
    {script.hook}

    📖 Source: {raw.url}

    ━━━━━━━━━━━━━━━━━━━━
    🔔 Subscribe for one historical event every day.
    ━━━━━━━━━━━━━━━━━━━━

    #shorts #history #onthisday #todayinhistory
