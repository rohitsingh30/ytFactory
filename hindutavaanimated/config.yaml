# HindutavaAnimated — Mahabharat ki kahaaniyan, narrated in pure Hindi,
# animated in Amar Chitra Katha comic-book style.
#
# Format (decided 2026-05-03, Sanskrit dropped 2026-05-03):
#   Pure Hindi storytelling — one dramatic episode from the epic per
#   Short, hooked at the top, lesson-as-punchline at the end.
#
#   1. hook (3s) — provocative one-liner ("क्या आप जानते हैं…")
#   2. setup (2-3 beats) — who, what, where
#   3. rising action (2-3 beats) — the dramatic moment escalates
#   4. climax / payoff (1 beat) — the moral pivot of the scene
#   5. lesson + spoken CTA (1 beat) — "जय श्री कृष्णा कमेंट करें,
#      चैनल सब्सक्राइब करें"
#
# Source candidates: Abhimanyu chakravyuh, Eklavya guru-dakshina,
# Karna kavach-kundal daan, Bheeshma iccha-mrityu, Draupadi cheer-haran,
# Ashwatthama ka shraap, etc.
#
# This channel is NOT a Reddit/sports clone — there is no auto source
# adapter. Stories are curated. `source_adapter: manual` tells stage 1
# to skip pulling and just expect a hand-authored script.json under
# hindutavaanimated/narrations/<slug>.json.

name: HindutavaAnimated
source_adapter: manual

# ---- TTS ---------------------------------------------------------------
# Kokoro hf_alpha (Hindi female, Apache 2.0, local).
#
# Indic Parler-TTS history (2026-05-04 → 2026-05-04 same day):
# Briefly defaulted to indic_parler for Hindi. Reverted within hours
# because parler-tts (the underlying library) hasn't been updated for
# transformers ≥ 4.49 — its Config API depends on a removed
# `PreTrainedConfig` attribute, and our venv requires transformers 4.49+
# for diffusers 0.38 (image-gen). Holding parler-tts' transformers pin
# would break image-gen for the whole repo. So Hindi is back on Kokoro
# until parler-tts ships a maintenance release OR we wire a different
# Hindi TTS lib. Indic Parler code stays in pipeline/audio.py for
# anyone willing to set up a separate venv.
#
# ---- TTS ---------------------------------------------------------------
# Voice matrix bench (2026-05-07) confirmed IndicF5 wins ALL 4 Hindi cells
# (composite 95-99 vs Indic Parler 84-88, Higgs 77-92, Kokoro 43-65).
# Production winner: cloudrun_indicf5 with announcer-quality voice ref
# from AI4Bharat IndicVoices-R (CC-BY-4.0). Falls back to local
# Kokoro hf_alpha on cloud failure (only on-laptop Hindi voice).
#
# Voice ref selection logic:
#   - Shorts narration → Indian female storyteller voice (announcer
#     quality, SNR 71 dB, mid-pitch 200-220 Hz, 30-45 age)
#   - Long-form kathaa → Indian female meditation voice (SNR 70 dB,
#     calm low-female pitch ~192 Hz, 45-60 age)
#
# Both refs live in pipeline/voice_refs/bench/ and were sourced from
# AI4Bharat IndicVoices-R (CC-BY-4.0) using a 65+dB SNR + low pitch
# variance + measured speaking rate filter. See
# scripts/pull_hindi_voices.py for selection criteria.
#
# Long-form / Sanskrit history (kept for context):
#   2026-05-04: Briefly tried indic_parler — broken in default venv
#     (parler-tts requires transformers <4.49, our venv needs 4.49+).
#   2026-05-04 → 2026-05-06: Defaulted to local Kokoro hf_alpha.
#   2026-05-06: Migrated to cloud Hindi (cloudrun_indicparler/indicf5).
#   2026-05-07: Voice matrix bench → cloudrun_indicf5 wins all cells.
tts_provider: cloudrun_indicf5
tts_voice: pipeline/voice_refs/bench/hindutavaanimated__shorts__hindi_female_storyteller/ref.wav
tts_ref_text: ये काफ़ी अच्छा होता है सेहत के लिए भी लोगों को भाता भी है चाहे कोई भी हो शौक से खाते हैं और शौक से पकाते हैं
tts_language: hi
tts_speed: 1.0       # Per-sentence modulation in audio.py drives final pacing.

# ---- Image gen — Amar Chitra Katha aesthetic --------------------------
image_provider: cloudrun_flux2_klein
image_style_prefix: |
  Amar Chitra Katha Indian comic-book illustration style. Bold black
  ink outlines, flat saturated colors — deep sindoor red, peacock blue,
  marigold yellow, emerald green, antique gold. Slightly stylized
  expressive Indian faces with large dark eyes and defined eyebrows.
  Decorative temple-mural background motifs. Composition centered and
  iconographic, like a single comic-book panel. No modern objects.

# Per-story character lock (cast.json overrides). The fallback below
# only applies when a story has no cast.json yet.
character_description: |
  Mahabharat-era Indian warrior. Fair-skinned, dark wavy hair tied
  back, expressive dark eyes, gold earrings, warrior tunic with gold
  trim, dhoti. Bold black ink outline, flat saturated colors. Always
  the same character across all images.

opening_image_directives:
  required_concrete_tokens: 2
  example_tokens: ["chariot wheel", "Gandiva bow", "conch shell",
                   "saffron flag", "rising sun", "two armies facing",
                   "ashram clearing", "guru's hut", "river bank"]

# Locked seed for character consistency across beats.
image_seed: 108  # auspicious in Hindu tradition
image_steps: 4
image_width: 768
image_height: 1344

# ---- Beat shape -------------------------------------------------------
# Slightly longer holds than AITA — kathaa is a slower medium and
# Devanagari captions need reading time.
beat_target_s: 3.0
beat_max_s: 5.0

# ---- Output -----------------------------------------------------------
# 50-60s — matches the 2026 Shorts algo sweet spot (memory: project_shorts_algo_2026).
duration_target_s: [50, 60]
output_resolution: [1080, 1920]

# ---- Closer CTA (devotional storytelling variant) --------------------
# No YTA/NTA verdict-bait. Spoken CTA is woven into the last beat
# (per feedback_closer_caption_style — captions = narration only),
# and the closer panel is a simple namaste + subscribe overlay.
closer_format: "जय श्री कृष्णा 🙏  SUBSCRIBE"
closer_hold_s: 1.5

# ---- Long-form kathaa mode (NEW 2026-05-05) ---------------------------
# Companion format to the Shorts. Authored via /make-katha; rendered
# via historyrecapped/scripts/render_footage_only.py --aspect 16:9.
# Same Kokoro hf_alpha voice; 16:9 horizontal; no captions by default;
# 6-10 chapters per video; 2 embedded asks.
kathaa:
  aspect: "16:9"
  output_resolution: [1920, 1080]
  duration_band: [50, 70]      # minutes
  caption_mode: none           # 'none' | 'devanagari'
  tts_speed: 1.0
  music_bed_db: -28            # ambient bed under narration
  closer_hold_s: 1.5
  upload_category_id: "22"     # People & Blogs (move to 27 Education if pivoting)
  description_template: |
    {script.metadata.invocation}

    🕉️ कथा: {script.metadata.episode}
    📿 अध्याय / कांड: {script.metadata.section}

    {chapter_timestamps_block}

    📖 स्रोत:
    {sources_block}

    ━━━━━━━━━━━━━━━━━━━━
    🙏 {script.blessing_close}
    🔔 SUBSCRIBE for more such kathaa
    ━━━━━━━━━━━━━━━━━━━━

    #hindukatha #bhagavadgita #ramayan #mahabharat #hindumythology #devotional #spiritualhindi #meditation

# ---- Upload (Stage 8) — NOT WIRED YET ---------------------------------
# Channel doesn't exist on YouTube yet. To enable:
#   1. Create the YouTube channel under a Google account.
#   2. .venv/bin/python upload.py auth --account hindutavaanimated
#   3. Flip auto_upload below to true.
upload:
  account: hindutavaanimated
  privacy: private          # keep mocks private until human-reviewed
  made_for_kids: false
  category_id: "22"          # People & Blogs
  auto_upload: false
  tags:
    - mahabharat
    - mahabharat in hindi
    - hindi kahani
    - hindi story
    - krishna
    - hindu mythology
    - pauranik kathayen
    - shorts
    - devotional
    - spirituality
  description_template: |
    {script.hook}

    🕉️ कथा: {script.metadata.episode}

    ━━━━━━━━━━━━━━━━━━━━
    🙏 जय श्री कृष्णा
    🔔 Subscribe for more Mahabharat stories
    ━━━━━━━━━━━━━━━━━━━━

    #shorts #mahabharat #krishna #hindi #kahani #hindumythology #devotional
