name: Nikamma images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web-next/**'
      - 'web/**'
      - 'control/**'
      - 'pipeline/**'
      - 'requirements-control.txt'
      - 'cloud/web-server/**'
      - 'cloud/web-next/**'
      - 'cloud/nikamma/**'
      - '.github/workflows/nikamma-images.yml'

permissions:
  contents: read

concurrency:
  group: nikamma-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    # Preserve the existing macOS build workaround documented in the Dockerfile.
    runs-on: macos-15
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      YTFACTORY_API_BASE: http://ytfactory-api:8080
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-next/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web-next
      - run: npm test
        working-directory: web-next
      - run: npm run build
        working-directory: web-next
      - name: Verify document and package build
        run: |
          python3 -c 'from pathlib import Path; assert Path("web-next/.next/server/app/index.html").read_text().lower().startswith("<!doctype html>"), "Invalid prerendered HTML"'
          tar -czf frontend-build.tgz --exclude=.next/cache -C web-next .next
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend-build.tgz
          retention-days: 7

  containers:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: cloud/web-server/Dockerfile
          - service: web
            dockerfile: cloud/web-next/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: matrix.service == 'web'
        with:
          name: frontend-build
      - if: matrix.service == 'web'
        run: tar -xzf frontend-build.tgz -C web-next
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build deployable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: ghcr.io/rohitsingh30/ytfactory-${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/rohitsingh30/ytFactory
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=nikamma-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=nikamma-${{ matrix.service }}
      - name: Test API authentication in the production image
        if: matrix.service == 'api'
        env:
          IMAGE: ghcr.io/rohitsingh30/ytfactory-api:${{ github.sha }}
        run: |
          docker run --rm -e YTFACTORY_QUEUE_BACKEND=memory -e OTEL_EXPORTER=inmemory \
            -v "$PWD/tests:/workspace/tests:ro" \
            -v "$PWD/cloud/nikamma:/workspace/cloud/nikamma:ro" "$IMAGE" \
            python -m unittest tests.test_nikamma_auth tests.test_nikamma_cloud_auth tests.test_nikamma_stage tests.test_auth_identity tests.test_cloudrun_auth
      - name: Smoke-test production image
        env:
          IMAGE: ghcr.io/rohitsingh30/ytfactory-${{ matrix.service }}:${{ github.sha }}
          SERVICE: ${{ matrix.service }}
        run: python3 cloud/nikamma/smoke_image.py "$SERVICE" "$IMAGE"
      - name: Publish tested image
        env:
          IMAGE: ghcr.io/rohitsingh30/ytfactory-${{ matrix.service }}:${{ github.sha }}
        run: |
          docker push "$IMAGE"
          docker image inspect "$IMAGE" --format '{{join .RepoDigests "\n"}}' >> "$GITHUB_STEP_SUMMARY"
