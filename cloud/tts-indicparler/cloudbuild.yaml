# Cloud Build config — passes HF_TOKEN as a BuildKit secret instead
# of a build-arg, so the token NEVER lands in the image layer
# history (audit S1.11). The deploy.sh writes the token into a temp
# file before submitting; Cloud Build reads it via the
# `availableSecrets` block (or, in the local-emulator path, from a
# direct file mount).
#
# Requires DOCKER_BUILDKIT=1 — we set it explicitly under env.

steps:
  - name: gcr.io/cloud-builders/docker
    env:
      - "DOCKER_BUILDKIT=1"
    secretEnv:
      - HF_TOKEN_VALUE
    entrypoint: bash
    args:
      - -c
      - |
        set -eu
        # Materialise the secret as a file BuildKit can mount via
        # --secret id=hf_token,src=...
        printf '%s' "${HF_TOKEN_VALUE}" > /workspace/.hf_token
        docker build \
          --secret id=hf_token,src=/workspace/.hf_token \
          --tag=${_IMAGE} \
          .
        rm -f /workspace/.hf_token
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE}

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_NUMBER}/secrets/hf-token/versions/latest
      env: HF_TOKEN_VALUE

substitutions:
  _IMAGE: ""           # set by deploy.sh

images:
  - ${_IMAGE}

timeout: 5400s
options:
  # Default global pool (free first 120 min/day). e2-medium worker.
  machineType: E2_MEDIUM
