# Cloud Build config — passes HF_TOKEN substitution as a Docker
# build-arg. Auto-detected by `gcloud builds submit` when present
# in the source dir.

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=HF_TOKEN=${_HF_TOKEN}
      - --tag=${_IMAGE}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE}

substitutions:
  _HF_TOKEN: ""        # passed via --substitutions=_HF_TOKEN=... at submit time
  _IMAGE: ""           # set by deploy.sh

images:
  - ${_IMAGE}

timeout: 5400s
options:
  # Default global pool (free first 120 min/day). e2-medium worker.
  machineType: E2_MEDIUM
