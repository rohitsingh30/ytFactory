# Cloud Build pipeline for the Z-Image-Turbo Cloud Run image.
#
# Why this exists (and why a plain `gcloud builds submit --tag` would fail):
#   The previous Dockerfile tried to do `gcloud storage cp -r gs://...` inside
#   a RUN step. That fails because Cloud Build's `docker build` ephemeral RUN
#   containers do NOT bridge the host's metadata-server credentials — gcloud
#   inside the RUN container has no ADC and hits 401.
#
#   The reliable pattern is: stage weights in a Cloud Build STEP (which DOES
#   have ADC via metadata), then have the Dockerfile COPY them in.
#
# Why bake the 33 GB Z-Image-Turbo weights at all:
#   At runtime, mounting via GCS Fuse cold-loads the 3 transformer shards in
#   30-90 minutes on first hit (verified 2026-05-16 logs: 1877 s/it for the
#   first shard, gcsfuse stalled reads + 1.5 s context-deadline cancels).
#   Cloud Run kills the inflight request long before the load finishes and
#   /generate returns "malformed response". Baked-in weights live on the
#   instance's local SSD via the read-only image layer, so cold-load drops
#   to ~30 s with predictable behavior.
#
# Build VM sizing: see the inline comments next to `machineType` and
# `diskSizeGb` in the `options:` block at the bottom — both have a
# specific incident write-up explaining why the value is what it is.
# RAM is not a constraint (gcloud storage cp + docker build stream to
# disk, not RAM).

steps:
  # Step 1 — pre-stage the 33 GiB Z-Image-Turbo weights to the shared
  # /workspace volume. The cloud-sdk image carries gcloud, which inherits
  # the build SA's ADC from Cloud Build's metadata server.
  - id: stage-weights
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        echo "==> staging Z-Image-Turbo weights from gs://${_WEIGHTS_BUCKET}"
        TARGET=/workspace/cloud/image-z-image-turbo/_weights
        mkdir -p "$${TARGET}"
        # gcloud storage cp does parallel/multipart transfers by default;
        # no flags needed. Same-region GCS → Cloud Build worker is fast
        # (typically 5-8 min for 33 GiB).
        gcloud storage cp -r \
          "gs://${_WEIGHTS_BUCKET}/flat/Tongyi-MAI/Z-Image-Turbo" \
          "$${TARGET}/"
        echo "==> weights staged:"
        du -sh "$${TARGET}/Z-Image-Turbo"
        ls -la "$${TARGET}/Z-Image-Turbo" | head -20
        df -h /workspace | tail -2

  # Step 2 — docker build. Context is scoped to cloud/image-z-image-turbo/
  # so the daemon only sees that subdir + the staged _weights/ tree
  # (NOT the rest of the repo). Faster context send, smaller layer.
  #
  # --cache-from + DOCKER_BUILDKIT make subsequent builds nearly
  # instant when only the app source (server.py, requirements.txt)
  # changes: BuildKit reuses the 33 GiB weights layer + the
  # pip-install layer from the previously-pushed image. First-ever
  # build (when ${_CACHE_FROM} doesn't exist yet) just no-ops the
  # cache pull and proceeds normally.
  - id: build
    name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    entrypoint: bash
    args:
      - -ceu
      - |
        # Best-effort cache pull — first ever build won't have one.
        docker pull "${_CACHE_FROM}" 2>/dev/null || \
          echo "(no cache image — full rebuild)"
        docker build \
          --cache-from "${_CACHE_FROM}" \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          -t "${_IMAGE}" \
          -f cloud/image-z-image-turbo/Dockerfile \
          cloud/image-z-image-turbo/

  # Step 3 — push to Artifact Registry. The 35 GiB push is the slow part
  # ONLY on the very first build. With BuildKit cache-from + inline-cache
  # tags on the previous push, layers that didn't change are skipped
  # ("Layer already exists"). Also push :latest as a floating tag so
  # subsequent builds find a cache source.
  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker push "${_IMAGE}"
        # Tag the same digest as :latest and push that too.
        # Floating :latest is the canonical cache-from source.
        LATEST="${_CACHE_FROM}"
        docker tag "${_IMAGE}" "$${LATEST}"
        docker push "$${LATEST}"

substitutions:
  _IMAGE: required-but-overridden-by-deploy.sh
  _WEIGHTS_BUCKET: ytfactory-prod-v3-model-weights
  # _CACHE_FROM is the most recent successful image tag — used by the
  # build step's BuildKit cache. deploy.sh sets it to the floating
  # `:latest` tag we publish on every successful build.
  _CACHE_FROM: asia-southeast1-docker.pkg.dev/ytfactory-prod-v3/ytfactory-tts/ytfactory-image-z-image-turbo:latest

images:
  - ${_IMAGE}

options:
  # E2_HIGHCPU_8 (NOT _32) — forced by GCP quota policy on 2026-05-23.
  # Background: builds prior to 2026-05-16 ran on E2_HIGHCPU_32. From
  # 2026-05-23 onwards a fresh submit fails with
  #   FAILED_PRECONDITION: due to quota restrictions, Cloud Build
  #   cannot run builds of this machine type in this region
  # in asia-southeast1. The public Cloud Quotas API does NOT expose this
  # lever (OngoingBuildCPUsPerProjectPerRegionPerOrigin already grants 40
  # CPUs, well above HIGHCPU_32's 32 vCPU need — so it's a machine-type
  # availability gate, not CPU headroom). A quota-preference request was
  # filed 2026-05-23 (traceId 47f4df65-6149-4536-9744-f6b2c5c6c14b);
  # the actual restoration requires a Google Cloud Customer Care case.
  # HIGHCPU_8 is the workable substitute today: the build is I/O-bound
  # on the 33-GiB weight staging + COPY, NOT CPU-bound, so wall-clock
  # impact is ~20-25 min instead of ~15. Do NOT raise this to _32 unless
  # the support case has been resolved (check the traceId above).
  machineType: E2_HIGHCPU_8
  # 400 GiB (NOT 200) — disk-exhaustion failure on 2026-05-23.
  # On that day a build failed at the `COPY _weights → /opt/model` step with
  #   ENOSPC: no space left on device while writing
  #   diffusion_pytorch_model-00002-of-00003.safetensors
  # The peak disk consumers at COPY-time:
  #   - /workspace/_weights staged from GCS:           ~33 GiB
  #   - BuildKit context transfer buffer (same data):  ~33 GiB
  #   - `docker pull :latest` for --cache-from:        ~40-50 GiB (this
  #     has grown over time — every build since 2026-05-16 added telemetry
  #     code + pip deps that the cache image now carries)
  #   - apt + cuda base + buildkit scratch:            ~5-10 GiB
  #   - COPY destination layer + overlay2 CoW expand:  ~33-66 GiB
  # Sum at COPY-time: 145-190 GiB. 200 GiB had no headroom for the CoW
  # spike on the last weight shard. 400 GiB gives ~2x headroom and the
  # incremental Cloud Build cost is trivial (~₹2 per build).
  diskSizeGb: 400
  logging: CLOUD_LOGGING_ONLY

timeout: 5400s
