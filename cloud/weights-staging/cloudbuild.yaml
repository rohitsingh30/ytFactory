# Cloud Build pipeline for staging large HuggingFace model weights into
# gs://ytfactory-prod-v3-model-weights/flat/<repo>/.
#
# Why Cloud Build instead of Cloud Run JOB:
#   - Cloud Run JOB caps at 32 GiB memory + 32 GiB tmpfs disk.
#   - Cloud Build with --machine-type=e2-highcpu-32 gets ~100 GB disk
#     and 32 GB RAM, which fits FLUX.2-dev's 64 GB total because the
#     largest single file (transformer ~24 GB) sits on disk during the
#     subsequent gsutil upload.
#   - Cloud Build streams stdout/stderr to GCS in real time so we get
#     observable per-file download/upload progress (the per-file
#     log line in stage.py prints after each file).
#
# Trigger:
#   gcloud builds submit --config=cloud/weights-staging/cloudbuild.yaml \
#     --substitutions=_REPOS=black-forest-labs/FLUX.2-dev \
#     --machine-type=e2-highcpu-32 --disk-size=200 \
#     --project=ytfactory-prod-v2 --no-source
#
# Or via the wrapper:
#   bash cloud/weights-staging/stage_via_cloudbuild.sh \
#     black-forest-labs/FLUX.2-dev
#
# 2026-05-15 — added after the in-Cloud-Run-JOB streaming approach
# OOM'd on the 24 GB FLUX.2-dev transformer (single-shot multipart
# upload buffered the whole file in memory; switching to true
# resumable still hung silently for 20+ min on the same file).

steps:
  # Step 1 — install Python deps + huggingface_hub.
  - id: install
    name: python:3.11-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install --quiet --no-cache-dir \
          "huggingface_hub>=0.25,<2.0" \
          "google-cloud-storage>=2.18,<4.0"
        echo "OK installed"

  # Step 2 — download the repo to /workspace (~100 GB available on
  # e2-highcpu-32). snapshot_download writes a flat directory tree
  # that mirrors the HF repo layout.
  - id: download
    name: python:3.11-slim
    entrypoint: bash
    env:
      - 'HF_XET_HIGH_PERFORMANCE=1'
      - 'STAGE_ROOT=/workspace/hf-stage'
    secretEnv:
      - 'HF_TOKEN'
    args:
      - -c
      - |
        set -euo pipefail
        # Re-install in this builder's filesystem (each step is a fresh
        # container with /workspace shared).
        # 2026-05-15 fix — install hf_xet for repos with files >50 GB
        # (FLUX.2-dev's transformer is 64 GB). Without hf_xet, HF's
        # regular download path raises ValueError("file too large").
        pip install --quiet --no-cache-dir \
          "huggingface_hub>=0.25,<2.0" \
          "hf_xet"

        REPOS_RAW="${_REPOS}"
        IFS=',' read -ra REPOS <<< "$${REPOS_RAW}"
        echo "==> staging $${#REPOS[@]} repos: $${REPOS[*]}"

        for repo in "$${REPOS[@]}"; do
          repo="$${repo// /}"
          [ -z "$$repo" ] && continue

          local_dir="/workspace/hf-stage/flat/$${repo}"
          mkdir -p "$${local_dir}"

          echo "==> $${repo} → $${local_dir}"
          python - <<PY
        import os, time
        from huggingface_hub import snapshot_download
        t0 = time.time()
        # FLUX.2-dev ships BOTH a 64 GB single-file flux2-dev.safetensors
        # AND a 7-shard transformer/ version totaling ~65 GB. We only
        # need the sharded one for diffusers' from_pretrained — skipping
        # the redundant single-file brings staging from 178 GB → 113 GB
        # (fits comfortably in Cloud Build's 200 GB disk).
        out = snapshot_download(
            repo_id="$${repo}",
            local_dir="$${local_dir}",
            token=os.environ.get("HF_TOKEN") or None,
            max_workers=4,
            ignore_patterns=["flux2-dev.safetensors"],
        )
        print(f"DOWNLOADED {out} in {time.time()-t0:.1f}s")
        PY
          df -h /workspace | tail -2
          du -sh "$${local_dir}"
        done

  # Step 3 — upload to GCS preserving the flat layout. gsutil -m cp -r
  # parallelizes 16-way by default; the staging bucket is in the same
  # region (asia-southeast1) so transfer is fast.
  - id: upload
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        BUCKET="${_BUCKET}"
        REPOS_RAW="${_REPOS}"
        IFS=',' read -ra REPOS <<< "$${REPOS_RAW}"

        for repo in "$${REPOS[@]}"; do
          repo="$${repo// /}"
          [ -z "$$repo" ] && continue
          local_dir="/workspace/hf-stage/flat/$${repo}"
          dest="gs://$${BUCKET}/flat/$${repo}/"
          if [ ! -d "$${local_dir}" ]; then
            echo "ERROR: download step did not produce $${local_dir}" >&2
            exit 1
          fi
          echo "==> uploading $${local_dir} → $${dest}"
          parent="$$(dirname $${repo})"
          gsutil -m -h "Cache-Control:no-cache" cp -r -n "$${local_dir}/" "gs://$${BUCKET}/flat/$${parent}/" 2>&1
          echo "==> verifying upload byte-counts"
          gsutil du -sh "$${dest}"
          rm -rf "$${local_dir}"
          df -h /workspace | tail -2
        done
        echo "==> ALL DONE"

substitutions:
  _REPOS: 'black-forest-labs/FLUX.2-dev'
  _BUCKET: 'ytfactory-prod-v3-model-weights'

availableSecrets:
  secretManager:
    - versionName: projects/ytfactory-prod-v3/secrets/ytfactory-hf-token/versions/latest
      env: 'HF_TOKEN'

options:
  # 100 GB disk for the build worker — required for FLUX.2-dev's
  # ~64 GB total. Default would be 30 GB and fail.
  diskSizeGb: 200
  # e2-highcpu-32 has 32 GB RAM + 32 vCPUs. snapshot_download itself
  # is memory-light (it streams downloads to disk); we picked this
  # for the 8-way parallel file fetch.
  machineType: 'E2_HIGHCPU_32'
  logging: CLOUD_LOGGING_ONLY

# 2 hour ceiling — FLUX.2-dev empirically takes 25-40 min from HF +
# 10-15 min upload to a same-region bucket. Doubled for headroom.
timeout: '7200s'
