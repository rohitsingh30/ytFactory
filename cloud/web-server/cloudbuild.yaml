# Cloud Build config for ytfactory-web (orchestrator).
# Substitution _IMAGE is set per-build by deploy.sh.

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - cloud/web-server/Dockerfile
      - -t
      - $_IMAGE
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_IMAGE

images:
  - $_IMAGE

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 25

timeout: 1800s
